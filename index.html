      {"id":"sf7","type":"fill","source":"考点3","text":"通常把控制部件、运算部件和各类寄存器互连组成的电路称为______。","answer":"中央处理器(CPU)，简称处理器","acceptAnswers":["CPU","中央处理器(CPU)，简称处理器","中央处理器，简称处理器","处理器"],"explanation":"得分点：中央处理器(CPU)，简称处理器\n\n考点原文：通常把控制部件、运算部件和各类寄存器互连组成的电路称为【中央处理器(CPU)，简称处理器】。"},
      {"id":"sf8","type":"fill","source":"考点4","text":"连接不同部件进行信息传输的介质称为______，其中，包含了用于传输地址信息、数据信息和控制信息的地址线、数据线和控制线。","answer":"总线","acceptAnswers":["总线"],"explanation":"得分点：总线\n\n考点原文：连接不同部件进行信息传输的介质称为【总线】，其中，包含了用于传输地址信息、数据信息和控制信息的地址线、数据线和控制线。"},
      {"id":"sf9","type":"fill","source":"考点5 P27-28","text":"程序和指令的执行过程\n冯·诺依曼结构计算机的功能通过______实现，程序的执行过程就是所包含的指令的执行过程，程序由一串指令组成。______是用0和 1表示的一串0/1序列，用来指示 CPU完成一个特定的原子操作。______指出指令的操作类型，如取数、存数、加、减、传送、跳转等。______指出指令所处理的操作数的地址，如寄存器编号、主存单元编号等。","answer":"执行程序、指令、操作码字段、地址码字段","acceptAnswers":["执行程序、指令、操作码字段、地址码字段","执行程序 指令 操作码字段 地址码字段"],"explanation":"得分点：执行程序、指令、操作码字段、地址码字段\n\n考点原文：程序和指令的执行过程\n冯·诺依曼结构计算机的功能通过【执行程序】实现，程序的执行过程就是所包含的指令的执行过程，程序由一串指令组成。【指令】是用0和 1表示的一串0/1序列，用来指示 CPU完成一个特定的原子操作。【操作码字段】指出指令的操作类型，如取数、存数、加、减、传送、跳转等。【地址码字段】指出指令所处理的操作数的地址，如寄存器编号、主存单元编号等。"},
      {"id":"sf10","type":"fill","source":"考点6 P30-32","text":"程序设计语言和翻译程序\n(1)使用特定计算机规定的指令格式而形成的 0/1序列称为______；计算机能理解和执行的程序称为______，其中的每条指令都由0和1 组成，称为______。","answer":"机器语言、机器代码或机器语言程序、机器指令","acceptAnswers":["机器语言、机器代码或机器语言程序、机器指令","机器语言 机器代码或机器语言程序 机器指令"],"explanation":"得分点：机器语言、机器代码或机器语言程序、机器指令\n\n考点原文：程序设计语言和翻译程序\n(1)使用特定计算机规定的指令格式而形成的 0/1序列称为【机器语言】；计算机能理解和执行的程序称为【机器代码或机器语言程序】，其中的每条指令都由0和1 组成，称为【机器指令】。\n(2)汇编语言与机器语言的关系：【汇编指令和机器指令一一对应，每条汇编指令表示的功能与对应的机器指令功能完全相同，因而汇编指令和机器指令都与特定的机器结构相关，因此汇编语言和机器语言都属于低级语言，它们统称为机器级语言】。"},
      {"id":"se1","type":"essay","source":"考点6 P30-32","text":"背诵填空：程序设计语言和翻译程序\n(2)汇编语言与机器语言的关系：______。","refAnswer":"<b>汇编指令和机器指令一一对应，每条汇编指令表示的功能与对应的机器指令功能完全相同，因而汇编指令和机器指令都与特定的机器结构相关，因此汇编语言和机器语言都属于低级语言，它们统称为机器级语言</b>\n\n完整考点：\n程序设计语言和翻译程序\n(1)使用特定计算机规定的指令格式而形成的 0/1序列称为【机器语言】；计算机能理解和执行的程序称为【机器代码或机器语言程序】，其中的每条指令都由0和1 组成，称为【机器指令】。\n(2)汇编语言与机器语言的关系：【汇编指令和机器指令一一对应，每条汇编指令表示的功能与对应的机器指令功能完全相同，因而汇编指令和机器指令都与特定的机器结构相关，因此汇编语言和机器语言都属于低级语言，它们统称为机器级语言】。"},
      {"id":"sf11","type":"fill","source":"考点7 P33-34","text":"可执行文件的启动和执行\n(1)一个用户程序被启动执行，必须依靠______的支持，包括提供人机接口环境(如外壳程序)和内核服务例程。例如，shell命令行解释器是操作系统外壳程序，它为用户提供了一个启动程序执行的操作环境，用来对用户从键盘输入的命令进行解释，并调出操作系统内核来加载用户程序(用户从键盘输入的命令所对应的程序)。","answer":"操作系统","acceptAnswers":["操作系统"],"explanation":"得分点：操作系统\n\n考点原文：可执行文件的启动和执行\n(1)一个用户程序被启动执行，必须依靠【操作系统】的支持，包括提供人机接口环境(如外壳程序)和内核服务例程。例如，shell命令行解释器是操作系统外壳程序，它为用户提供了一个启动程序执行的操作环境，用来对用户从键盘输入的命令进行解释，并调出操作系统内核来加载用户程序(用户从键盘输入的命令所对应的程序)。\n(2)键盘、磁盘和显示器等外部设备简称为外设，也称为【I/O设备】，I/O是输入/输出的缩写。外设通常由机械部分和电子部分组成，两部分通常是可以分开的。机械部分是外部设备本身，而电子部分则是控制外部设备工作的【I/O 控制器或I/O适配器】。外设通过I/O控制器或I/O 适配器连接到主机上，I/O控制器或I/O适配器统称为设备控制器。例如，键盘接口、打印机适配器、显示控制卡(简称显卡)、网络控制卡(简称网卡)等都是一种设备控制器，属于一种【I/O模块】。"},
      {"id":"sf12","type":"fill","source":"考点7 P33-34","text":"可执行文件的启动和执行\n(2)键盘、磁盘和显示器等外部设备简称为外设，也称为______，I/O是输入/输出的缩写。外设通常由机械部分和电子部分组成，两部分通常是可以分开的。机械部分是外部设备本身，而电子部分则是控制外部设备工作的______。外设通过I/O控制器或I/O 适配器连接到主机上，I/O控制器或I/O适配器统称为设备控制器。例如，键盘接口、打印机适配器、显示控制卡(简称显卡)、网络控制卡(简称网卡)等都是一种设备控制器，属于一种______。","answer":"I/O设备、I/O 控制器或I/O适配器、I/O模块","acceptAnswers":["I/O设备、I/O 控制器或I/O适配器、I/O模块","I/O设备 I/O 控制器或I/O适配器 I/O模块"],"explanation":"得分点：I/O设备、I/O 控制器或I/O适配器、I/O模块\n\n考点原文：可执行文件的启动和执行\n(1)一个用户程序被启动执行，必须依靠【操作系统】的支持，包括提供人机接口环境(如外壳程序)和内核服务例程。例如，shell命令行解释器是操作系统外壳程序，它为用户提供了一个启动程序执行的操作环境，用来对用户从键盘输入的命令进行解释，并调出操作系统内核来加载用户程序(用户从键盘输入的命令所对应的程序)。\n(2)键盘、磁盘和显示器等外部设备简称为外设，也称为【I/O设备】，I/O是输入/输出的缩写。外设通常由机械部分和电子部分组成，两部分通常是可以分开的。机械部分是外部设备本身，而电子部分则是控制外部设备工作的【I/O 控制器或I/O适配器】。外设通过I/O控制器或I/O 适配器连接到主机上，I/O控制器或I/O适配器统称为设备控制器。例如，键盘接口、打印机适配器、显示控制卡(简称显卡)、网络控制卡(简称网卡)等都是一种设备控制器，属于一种【I/O模块】。"},
      {"id":"se2","type":"essay","source":"考点8 P32","text":"背诵考点：文本文件\n（请完整回忆并表述该考点内容）","refAnswer":"文本文件：通常把用ASCII码字符或汉字字符表示的文件称为文本文件，源程序文件都是文本文件，是可显示和可读的。"},
      {"id":"sf13","type":"fill","source":"考点9","text":"提供程序编辑器和各类翻译转换软件的工具包统称为______。","answer":"语言处理系统或软件的集成开发环境(IDE)","acceptAnswers":["IDE","语言处理系统或软件的集成开发环境","语言处理系统或软件的集成开发环境(IDE)"],"explanation":"得分点：语言处理系统或软件的集成开发环境(IDE)\n\n考点原文：提供程序编辑器和各类翻译转换软件的工具包统称为【语言处理系统或软件的集成开发环境(IDE)】。"},
      {"id":"se3","type":"essay","source":"考点10","text":"背诵填空：机器语言程序所运行的计算机硬件和软件之间需要有一个“桥梁”、这个在软件和硬件之间的界面就是______。","refAnswer":"<b>指令集体系结构(ISA),简称指令集架构或指令系统</b>\n\n完整考点：\n机器语言程序所运行的计算机硬件和软件之间需要有一个“桥梁”、这个在软件和硬件之间的界面就是【指令集体系结构(ISA),简称指令集架构或指令系统】。"},
      {"id":"sf14","type":"fill","source":"考点11","text":"实现ISA的电路逻辑结构称为______。","answer":"计算机组织或微体系结构，简称微架构","acceptAnswers":["微体系结构，简称微架构","微架构","计算机组织","计算机组织 微体系结构，简称微架构","计算机组织或微体系结构，简称微架构"],"explanation":"得分点：计算机组织或微体系结构，简称微架构\n\n考点原文：实现ISA的电路逻辑结构称为【计算机组织或微体系结构，简称微架构】。"},
      {"id":"sf15","type":"fill","source":"考点12 P36-37","text":"计算机系统的不同用户\n______包括为有效、安全地使用和管理计算机以及为开发和运行应用软件而提供的各种软件，介于计算机硬件与应用程序之间。______指专门为数据处理、科学计算、事务管理、多媒体处理、工程设计以及过程控制等应用所编写的各类程序。使用应用软件完成特定任务的计算机用户称为______。在计算机技术中，一个存在的事物或概念从某个角度看似乎不存在，即对实际存在的事物或概念感觉不到，则称为______。","answer":"系统软件、应用软件、最终用户、透明","acceptAnswers":["系统软件、应用软件、最终用户、透明","系统软件 应用软件 最终用户 透明"],"explanation":"得分点：系统软件、应用软件、最终用户、透明\n\n考点原文：计算机系统的不同用户\n【系统软件】包括为有效、安全地使用和管理计算机以及为开发和运行应用软件而提供的各种软件，介于计算机硬件与应用程序之间。【应用软件】指专门为数据处理、科学计算、事务管理、多媒体处理、工程设计以及过程控制等应用所编写的各类程序。使用应用软件完成特定任务的计算机用户称为【最终用户】。在计算机技术中，一个存在的事物或概念从某个角度看似乎不存在，即对实际存在的事物或概念感觉不到，则称为【透明】。"},
      {"id":"se4","type":"essay","source":"考点13 P37","text":"背诵填空：计算机系统的层次化结构\nISA是整个计算机系统中的核心部分。ISA 层下面是硬件部分(含 CPU、主存和输入/输出等部件)，上面是软件部分(含系统软件和应用软件)。汇编程序、编译程序和操作系统等系统软件直接在ISA上实现。系统管理员工作在操作系统层，所看到的是配置了操作系统的虚拟机器，称为______；汇编语言程序员工作在提供汇编程序的虚拟机器级，所看到的机器称为______；应用程序员大多工作在提供编译器或解释器等翻译程序的语言处理系统层，因此，应用程序员大多用高级语言编写程序，因而也称为高级语言程序员，所看到虚拟机器称为______；______。","refAnswer":"<b>操作系统虚拟机、汇编语言虚拟机、高级语言虚拟机、最终用户则工作在最上面的应用程序层</b>\n\n完整考点：\n计算机系统的层次化结构\nISA是整个计算机系统中的核心部分。ISA 层下面是硬件部分(含 CPU、主存和输入/输出等部件)，上面是软件部分(含系统软件和应用软件)。汇编程序、编译程序和操作系统等系统软件直接在ISA上实现。系统管理员工作在操作系统层，所看到的是配置了操作系统的虚拟机器，称为【操作系统虚拟机】；汇编语言程序员工作在提供汇编程序的虚拟机器级，所看到的机器称为【汇编语言虚拟机】；应用程序员大多工作在提供编译器或解释器等翻译程序的语言处理系统层，因此，应用程序员大多用高级语言编写程序，因而也称为高级语言程序员，所看到虚拟机器称为【高级语言虚拟机】；【最终用户则工作在最上面的应用程序层】。"},
      {"id":"sf16","type":"fill","source":"考点14","text":"考量一个计算机系统性能的两个基本指标：______。","answer":"吞吐率和响应时间","acceptAnswers":["吞吐率 响应时间","吞吐率和响应时间"],"explanation":"得分点：吞吐率和响应时间\n\n考点原文：考量一个计算机系统性能的两个基本指标：【吞吐率和响应时间】。"},
      {"id":"sf17","type":"fill","source":"考点15","text":"______指CPU用于本程序执行的时间","answer":"CPU时间","acceptAnswers":["CPU时间"],"explanation":"得分点：CPU时间\n\n考点原文：【CPU时间】指CPU用于本程序执行的时间\n包括两部分：①【用户CPU时间】，指真正用于运行用户程序代码的时间；\n②【系统CPU时间】，指为了执行用户程序而需要CPU运行操作系统程序的时间。【其他时间】指等待I/O操作完成的时间或CPU用于执行其他用户程序的时间。计算机系统的性能评价主要考虑的是【CPU性能】。"},
      {"id":"sf18","type":"fill","source":"考点15","text":"包括两部分：①______，指真正用于运行用户程序代码的时间","answer":"用户CPU时间","acceptAnswers":["用户CPU时间"],"explanation":"得分点：用户CPU时间\n\n考点原文：【CPU时间】指CPU用于本程序执行的时间\n包括两部分：①【用户CPU时间】，指真正用于运行用户程序代码的时间；\n②【系统CPU时间】，指为了执行用户程序而需要CPU运行操作系统程序的时间。【其他时间】指等待I/O操作完成的时间或CPU用于执行其他用户程序的时间。计算机系统的性能评价主要考虑的是【CPU性能】。"},
      {"id":"sf19","type":"fill","source":"考点15","text":"②______，指为了执行用户程序而需要CPU运行操作系统程序的时间。______指等待I/O操作完成的时间或CPU用于执行其他用户程序的时间。计算机系统的性能评价主要考虑的是______。","answer":"系统CPU时间、其他时间、CPU性能","acceptAnswers":["系统CPU时间、其他时间、CPU性能","系统CPU时间 其他时间 CPU性能"],"explanation":"得分点：系统CPU时间、其他时间、CPU性能\n\n考点原文：【CPU时间】指CPU用于本程序执行的时间\n包括两部分：①【用户CPU时间】，指真正用于运行用户程序代码的时间；\n②【系统CPU时间】，指为了执行用户程序而需要CPU运行操作系统程序的时间。【其他时间】指等待I/O操作完成的时间或CPU用于执行其他用户程序的时间。计算机系统的性能评价主要考虑的是【CPU性能】。"},
      {"id":"sf20","type":"fill","source":"考点16","text":"______就是CPU主脉冲信号的时钟频率，是CPU时钟周期的倒数。","answer":"CPU的主频","acceptAnswers":["CPU的主频"],"explanation":"得分点：CPU的主频\n\n考点原文：【CPU的主频】就是CPU主脉冲信号的时钟频率，是CPU时钟周期的倒数。"},
      {"id":"sf21","type":"fill","source":"考点17","text":"最早用来衡量计算机性能的指标是______。","answer":"每秒钟完成单个运算指令(如加法指令)的条数","acceptAnswers":["如加法指令","每秒钟完成单个运算指令(如加法指令)的条数","每秒钟完成单个运算指令的条数"],"explanation":"得分点：每秒钟完成单个运算指令(如加法指令)的条数\n\n考点原文：最早用来衡量计算机性能的指标是【每秒钟完成单个运算指令(如加法指令)的条数】。"},
      {"id":"sf22","type":"fill","source":"考点18","text":"______是专门用来进行性能评价的一组程序，能够很好地反映机器在运行实际负载时的性能，可以通过在不同机器上运行相同的基准程序来比较在不同机器上的运行时间，从而评测其性能。","answer":"基准程序","acceptAnswers":["基准程序"],"explanation":"得分点：基准程序\n\n考点原文：【基准程序】是专门用来进行性能评价的一组程序，能够很好地反映机器在运行实际负载时的性能，可以通过在不同机器上运行相同的基准程序来比较在不同机器上的运行时间，从而评测其性能。"},
      {"id":"se5","type":"essay","source":"考点19","text":"背诵填空：进位制转换：______。","refAnswer":"<b>R进制转十进制按权展开；十进制转R 进制分整数(除基取余，上右下左)和小数(乘基取整，上左下右)；八进制转二进制，把每一个八进制数字改写成等值的3 位二进制数，且保持高低位的次序不变；十六进制转二进制，把每一个十六进制数字改写成等值的4 位二进制数，且保持高低位的次序不变</b>\n\n完整考点：\n进位制转换：【R进制转十进制按权展开；十进制转R 进制分整数(除基取余，上右下左)和小数(乘基取整，上左下右)；八进制转二进制，把每一个八进制数字改写成等值的3 位二进制数，且保持高低位的次序不变；十六进制转二进制，把每一个十六进制数字改写成等值的4 位二进制数，且保持高低位的次序不变】。"},
      {"id":"sf23","type":"fill","source":"考点20","text":"通常将数值数据在计算机内部编码表示的数称为机器数，而机器数真正的值(即现实世界中带有正负号的数)称为机器数的______。机器数一定是一个0/1序列，通常缩写成十六进制形式。","answer":"真值","acceptAnswers":["真值"],"explanation":"得分点：真值\n\n考点原文：通常将数值数据在计算机内部编码表示的数称为机器数，而机器数真正的值(即现实世界中带有正负号的数)称为机器数的【真值】。机器数一定是一个0/1序列，通常缩写成十六进制形式。"},
      {"id":"se6","type":"essay","source":"考点21","text":"背诵填空：定点数的编码表示：______。","refAnswer":"<b>原码表示法；补码表示法；反码表示法；移码表示法</b>\n\n完整考点：\n定点数的编码表示：【原码表示法；补码表示法；反码表示法；移码表示法】。"},
      {"id":"sf24","type":"fill","source":"考点22","text":"正数的补码是它本身；负数的补码等于______。","answer":"模与该负数绝对值之差","acceptAnswers":["模与该负数绝对值之差"],"explanation":"得分点：模与该负数绝对值之差\n\n考点原文：正数的补码是它本身；负数的补码等于【模与该负数绝对值之差】。"},
      {"id":"se7","type":"essay","source":"考点23","text":"背诵填空：补码与真值之间的转换方法：______。","refAnswer":"<b>求一个正数的补码时，只要将正号“+”转换为0，数值部分无须改变；求一个负数的补码时，需要做减法运算</b>\n\n完整考点：\n补码与真值之间的转换方法：【求一个正数的补码时，只要将正号“+”转换为0，数值部分无须改变；求一个负数的补码时，需要做减法运算】。"},
      {"id":"sf25","type":"fill","source":"考点24","text":"整数的小数点隐含在数的最右边，故无须表示小数点，也被称为______。二进制整数分为______。","answer":"定点数、无符号整数和带符号整数","acceptAnswers":["定点数、无符号整数和带符号整数","定点数 无符号整数和带符号整数"],"explanation":"得分点：定点数、无符号整数和带符号整数\n\n考点原文：整数的小数点隐含在数的最右边，故无须表示小数点，也被称为【定点数】。二进制整数分为【无符号整数和带符号整数】。"},
      {"id":"sf26","type":"fill","source":"考点25","text":"当一个编码的所有二进位都用来表示数值而没有符号位时，该编码表示的就是______。此时，默认数的符号为正，所以无符号整数就是正整数或非负整数。","answer":"无符号整数","acceptAnswers":["无符号整数"],"explanation":"得分点：无符号整数\n\n考点原文：当一个编码的所有二进位都用来表示数值而没有符号位时，该编码表示的就是【无符号整数】。此时，默认数的符号为正，所以无符号整数就是正整数或非负整数。"},
      {"id":"sf27","type":"fill","source":"考点26","text":"______，使用无符号整数表示。","answer":"一般在全部是正数运算且不出现负值结果的场合下","acceptAnswers":["一般在全部是正数运算且不出现负值结果的场合下"],"explanation":"得分点：一般在全部是正数运算且不出现负值结果的场合下\n\n考点原文：【一般在全部是正数运算且不出现负值结果的场合下】，使用无符号整数表示。"},
      {"id":"sf28","type":"fill","source":"考点27","text":"______也被称为有符号整数，它必须用一个二进位来表示符号。","answer":"带符号整数","acceptAnswers":["带符号整数"],"explanation":"得分点：带符号整数\n\n考点原文：【带符号整数】也被称为有符号整数，它必须用一个二进位来表示符号。"},
      {"id":"sf29","type":"fill","source":"考点28","text":"浮点数尾数的位数决定浮点数的有效数位，______。为了在浮点数运算过程中，尽可能多地保留有效数字的位数，使有效数字尽量占满尾数数位，必须在运算过程中对浮点数进行______。对浮点数的尾数进行规格化，除了能得到尽量多的有效数位以外，还可以使浮点数的表示具有______。","answer":"有效数位越多，数据的精度越高、“规格化”操作、唯一性","acceptAnswers":["有效数位越多，数据的精度越高、“规格化”操作、唯一性","有效数位越多，数据的精度越高 “规格化”操作 唯一性"],"explanation":"得分点：有效数位越多，数据的精度越高、“规格化”操作、唯一性\n\n考点原文：浮点数尾数的位数决定浮点数的有效数位，【有效数位越多，数据的精度越高】。为了在浮点数运算过程中，尽可能多地保留有效数字的位数，使有效数字尽量占满尾数数位，必须在运算过程中对浮点数进行【“规格化”操作】。对浮点数的尾数进行规格化，除了能得到尽量多的有效数位以外，还可以使浮点数的表示具有【唯一性】。"},
      {"id":"sf30","type":"fill","source":"考点29","text":"目前几乎所有计算机都采用______表示浮点数。在这个标准中，提供了两种基本浮点格式：______","answer":"IEEE754标准、32位单精度和64 位双精度格式","acceptAnswers":["IEEE754标准、32位单精度和64 位双精度格式","IEEE754标准 32位单精度和64 位双精度格式"],"explanation":"得分点：IEEE754标准、32位单精度和64 位双精度格式\n\n考点原文：目前几乎所有计算机都采用【IEEE754标准】表示浮点数。在这个标准中，提供了两种基本浮点格式：【32位单精度和64 位双精度格式】"},
      {"id":"sf31","type":"fill","source":"考点30","text":"单精度和双精度浮点数的偏置常数分别为______。","answer":"127和1023","acceptAnswers":["127 1023","127和1023"],"explanation":"得分点：127和1023\n\n考点原文：单精度和双精度浮点数的偏置常数分别为【127和1023】。"},
      {"id":"sf32","type":"fill","source":"考点31","text":"非规格化数的特点是阶码部分的编码为全0，尾数高位有一个或几个连续的0，但不全为 0。因此非规格化数的隐藏位为0，并且单精度和双精度浮点数的阶分别为______，故数值分别为(-1)ˢ×0.f×2⁻¹²⁶和(-1)ˢ×0.f×2⁻¹⁰²²。","answer":"-126或-1022","acceptAnswers":["-1022","-126","-126 -1022","-126或-1022"],"explanation":"得分点：-126或-1022\n\n考点原文：非规格化数的特点是阶码部分的编码为全0，尾数高位有一个或几个连续的0，但不全为 0。因此非规格化数的隐藏位为0，并且单精度和双精度浮点数的阶分别为【-126或-1022】，故数值分别为(-1)ˢ×0.f×2⁻¹²⁶和(-1)ˢ×0.f×2⁻¹⁰²²。"},
      {"id":"sf33","type":"fill","source":"考点32","text":"n位二进制数可表示______。逻辑数据只能参加逻辑运算，并且是按位进行的，如按位“与”、按位“或”、逻辑左移、逻辑右移等。逻辑数据和数值数据都是一串______，在形式上无任何差异，需要通过指令的操作码类型来识别它们。","answer":"n个逻辑值、0/1 序列","acceptAnswers":["n个逻辑值、0/1 序列","n个逻辑值 0/1 序列"],"explanation":"得分点：n个逻辑值、0/1 序列\n\n考点原文：n位二进制数可表示【n个逻辑值】。逻辑数据只能参加逻辑运算，并且是按位进行的，如按位“与”、按位“或”、逻辑左移、逻辑右移等。逻辑数据和数值数据都是一串【0/1 序列】，在形式上无任何差异，需要通过指令的操作码类型来识别它们。"},
      {"id":"sf34","type":"fill","source":"考点33","text":"西文由拉丁字母、数字、标点符号及一些特殊符号所组成，它们统称为“______”。所有字符的集合叫作“字符集”。字符集中每一个字符都有一个代码(即二进制编码的0/1序列)，构成了该字符集的代码表，简称______。码表中的代码具有唯一性。字符主要用于外部设备和计算机之间交换信息。","answer":"字符、码表","acceptAnswers":["字符、码表","字符 码表"],"explanation":"得分点：字符、码表\n\n考点原文：西文由拉丁字母、数字、标点符号及一些特殊符号所组成，它们统称为“【字符】”。所有字符的集合叫作“字符集”。字符集中每一个字符都有一个代码(即二进制编码的0/1序列)，构成了该字符集的代码表，简称【码表】。码表中的代码具有唯一性。字符主要用于外部设备和计算机之间交换信息。"},
      {"id":"sf35","type":"fill","source":"考点34","text":"目前计算机中使用最广泛的西文字符集及其编码是______。","answer":"ASCII码，即美国标准信息交换码","acceptAnswers":["ASCII码，即美国标准信息交换码","美国标准信息交换码"],"explanation":"得分点：ASCII码，即美国标准信息交换码\n\n考点原文：目前计算机中使用最广泛的西文字符集及其编码是【ASCII码，即美国标准信息交换码】。"},
      {"id":"sf36","type":"fill","source":"考点35","text":"为了适应汉字系统各组成部分对汉字信息处理的不同需要，汉字系统必须处理的汉字代码：______。","answer":"输入码、内码、字形码","acceptAnswers":["输入码、内码、字形码"],"explanation":"得分点：输入码、内码、字形码\n\n考点原文：为了适应汉字系统各组成部分对汉字信息处理的不同需要，汉字系统必须处理的汉字代码：【输入码、内码、字形码】。\n(1)目前，最简便、最广泛采用的汉字输入方法是利用英文键盘输入汉字。由于汉字字数多，无法使每个汉字与西文键盘上的一个键相对应，因此必须使每个汉字用一个或几个键来表示，这种对每个汉字用相应的按键进行的编码表示就称为【汉字的输入码/外码】。搜狗拼音输入法、搜狗五笔输入法、微软拼音输入法等都是常用的汉字输入法。\n(2)为了适应计算机处理汉字信息的需要，1981年我国颁布《信息交换用汉字编码字符集·基本集》(GB2312-80)。该标准选出 6763个常用汉字，为每个汉字规定了标准代码，以供汉字信息在不同计算机系统之间交换使用，这个标准称为【国标码/国标交换码】。每一个汉字或符号在码表中都有各自的位置，因此各有一个唯一的位置编码，称为【区位码】。\n(3)汉字的字形主要有两种描述方法：字模点阵描述和轮廓描述。【字模点阵描述】是将字库中的各个汉字或其他字符的字形(即字模)，用一个其元素由“0”和“1”组成的方阵来表示，汉字或字符中有黑点的地方用“1”表示，空白处用“0”表示，这种用来描述汉字字模的二进制点阵数据称为汉字的字模点阵码。【汉字的轮廓描述方法】比较复杂，它把汉字笔画的轮廓用一组直线和曲线来勾画，记下每一直线和曲线的数学描述公式。目前已有两类国际标准：【Adobe Type1和TrueType】。这种用轮廓线描述字形的方式精度高，字形大小可以任意变化。"},
      {"id":"sf37","type":"fill","source":"考点35","text":"(1)目前，最简便、最广泛采用的汉字输入方法是利用英文键盘输入汉字。由于汉字字数多，无法使每个汉字与西文键盘上的一个键相对应，因此必须使每个汉字用一个或几个键来表示，这种对每个汉字用相应的按键进行的编码表示就称为______。搜狗拼音输入法、搜狗五笔输入法、微软拼音输入法等都是常用的汉字输入法。","answer":"汉字的输入码/外码","acceptAnswers":["汉字的输入码/外码"],"explanation":"得分点：汉字的输入码/外码\n\n考点原文：为了适应汉字系统各组成部分对汉字信息处理的不同需要，汉字系统必须处理的汉字代码：【输入码、内码、字形码】。\n(1)目前，最简便、最广泛采用的汉字输入方法是利用英文键盘输入汉字。由于汉字字数多，无法使每个汉字与西文键盘上的一个键相对应，因此必须使每个汉字用一个或几个键来表示，这种对每个汉字用相应的按键进行的编码表示就称为【汉字的输入码/外码】。搜狗拼音输入法、搜狗五笔输入法、微软拼音输入法等都是常用的汉字输入法。\n(2)为了适应计算机处理汉字信息的需要，1981年我国颁布《信息交换用汉字编码字符集·基本集》(GB2312-80)。该标准选出 6763个常用汉字，为每个汉字规定了标准代码，以供汉字信息在不同计算机系统之间交换使用，这个标准称为【国标码/国标交换码】。每一个汉字或符号在码表中都有各自的位置，因此各有一个唯一的位置编码，称为【区位码】。\n(3)汉字的字形主要有两种描述方法：字模点阵描述和轮廓描述。【字模点阵描述】是将字库中的各个汉字或其他字符的字形(即字模)，用一个其元素由“0”和“1”组成的方阵来表示，汉字或字符中有黑点的地方用“1”表示，空白处用“0”表示，这种用来描述汉字字模的二进制点阵数据称为汉字的字模点阵码。【汉字的轮廓描述方法】比较复杂，它把汉字笔画的轮廓用一组直线和曲线来勾画，记下每一直线和曲线的数学描述公式。目前已有两类国际标准：【Adobe Type1和TrueType】。这种用轮廓线描述字形的方式精度高，字形大小可以任意变化。"},
      {"id":"sf38","type":"fill","source":"考点35","text":"(2)为了适应计算机处理汉字信息的需要，1981年我国颁布《信息交换用汉字编码字符集·基本集》(GB2312-80)。该标准选出 6763个常用汉字，为每个汉字规定了标准代码，以供汉字信息在不同计算机系统之间交换使用，这个标准称为______。每一个汉字或符号在码表中都有各自的位置，因此各有一个唯一的位置编码，称为______。","answer":"国标码/国标交换码、区位码","acceptAnswers":["国标码/国标交换码、区位码","国标码/国标交换码 区位码"],"explanation":"得分点：国标码/国标交换码、区位码\n\n考点原文：为了适应汉字系统各组成部分对汉字信息处理的不同需要，汉字系统必须处理的汉字代码：【输入码、内码、字形码】。\n(1)目前，最简便、最广泛采用的汉字输入方法是利用英文键盘输入汉字。由于汉字字数多，无法使每个汉字与西文键盘上的一个键相对应，因此必须使每个汉字用一个或几个键来表示，这种对每个汉字用相应的按键进行的编码表示就称为【汉字的输入码/外码】。搜狗拼音输入法、搜狗五笔输入法、微软拼音输入法等都是常用的汉字输入法。\n(2)为了适应计算机处理汉字信息的需要，1981年我国颁布《信息交换用汉字编码字符集·基本集》(GB2312-80)。该标准选出 6763个常用汉字，为每个汉字规定了标准代码，以供汉字信息在不同计算机系统之间交换使用，这个标准称为【国标码/国标交换码】。每一个汉字或符号在码表中都有各自的位置，因此各有一个唯一的位置编码，称为【区位码】。\n(3)汉字的字形主要有两种描述方法：字模点阵描述和轮廓描述。【字模点阵描述】是将字库中的各个汉字或其他字符的字形(即字模)，用一个其元素由“0”和“1”组成的方阵来表示，汉字或字符中有黑点的地方用“1”表示，空白处用“0”表示，这种用来描述汉字字模的二进制点阵数据称为汉字的字模点阵码。【汉字的轮廓描述方法】比较复杂，它把汉字笔画的轮廓用一组直线和曲线来勾画，记下每一直线和曲线的数学描述公式。目前已有两类国际标准：【Adobe Type1和TrueType】。这种用轮廓线描述字形的方式精度高，字形大小可以任意变化。"},
      {"id":"se8","type":"essay","source":"考点35","text":"背诵填空：(3)汉字的字形主要有两种描述方法：字模点阵描述和轮廓描述。______是将字库中的各个汉字或其他字符的字形(即字模)，用一个其元素由“0”和“1”组成的方阵来表示，汉字或字符中有黑点的地方用“1”表示，空白处用“0”表示，这种用来描述汉字字模的二进制点阵数据称为汉字的字模点阵码。______比较复杂，它把汉字笔画的轮廓用一组直线和曲线来勾画，记下每一直线和曲线的数学描述公式。目前已有两类国际标准：______。这种用轮廓线描述字形的方式精度高，字形大小可以任意变化。","refAnswer":"<b>字模点阵描述、汉字的轮廓描述方法、Adobe Type1和TrueType</b>\n\n完整考点：\n为了适应汉字系统各组成部分对汉字信息处理的不同需要，汉字系统必须处理的汉字代码：【输入码、内码、字形码】。\n(1)目前，最简便、最广泛采用的汉字输入方法是利用英文键盘输入汉字。由于汉字字数多，无法使每个汉字与西文键盘上的一个键相对应，因此必须使每个汉字用一个或几个键来表示，这种对每个汉字用相应的按键进行的编码表示就称为【汉字的输入码/外码】。搜狗拼音输入法、搜狗五笔输入法、微软拼音输入法等都是常用的汉字输入法。\n(2)为了适应计算机处理汉字信息的需要，1981年我国颁布《信息交换用汉字编码字符集·基本集》(GB2312-80)。该标准选出 6763个常用汉字，为每个汉字规定了标准代码，以供汉字信息在不同计算机系统之间交换使用，这个标准称为【国标码/国标交换码】。每一个汉字或符号在码表中都有各自的位置，因此各有一个唯一的位置编码，称为【区位码】。\n(3)汉字的字形主要有两种描述方法：字模点阵描述和轮廓描述。【字模点阵描述】是将字库中的各个汉字或其他字符的字形(即字模)，用一个其元素由“0”和“1”组成的方阵来表示，汉字或字符中有黑点的地方用“1”表示，空白处用“0”表示，这种用来描述汉字字模的二进制点阵数据称为汉字的字模点阵码。【汉字的轮廓描述方法】比较复杂，它把汉字笔画的轮廓用一组直线和曲线来勾画，记下每一直线和曲线的数学描述公式。目前已有两类国际标准：【Adobe Type1和TrueType】。这种用轮廓线描述字形的方式精度高，字形大小可以任意变化。"},
      {"id":"sf39","type":"fill","source":"考点36","text":"______指 CPU 内部用于整数运算的数据通路的宽度。CPU内部数据通路指CPU内部的数据流经的路径以及路径上的部件，主要是CPU内部进行数据运算、存储和传送的部件，这些部件的宽度基本上要一致，才能相互匹配。因此，字长等于CPU内部用于整数运算的运算器位数和通用寄存器的宽度。","answer":"字长","acceptAnswers":["字长"],"explanation":"得分点：字长\n\n考点原文：【字长】指 CPU 内部用于整数运算的数据通路的宽度。CPU内部数据通路指CPU内部的数据流经的路径以及路径上的部件，主要是CPU内部进行数据运算、存储和传送的部件，这些部件的宽度基本上要一致，才能相互匹配。因此，字长等于CPU内部用于整数运算的运算器位数和通用寄存器的宽度。"},
      {"id":"sf40","type":"fill","source":"考点37","text":"计算机内部任何信息都被表示成二进制编码形式。二进制数据的每一位(0或1)是组成二进制信息的最小单位，称为一个______，或称位元，简称位。比特是计算机中处理、存储和传输信息的最小单位。每个西文字符需要用8 位表示，而每个汉字需要用16位才能表示。在计算机内部，二进制信息的计量单位是______，一个字节等于8位。通常用b表示位，用B表示字节。","answer":"比特、字节","acceptAnswers":["比特、字节","比特 字节"],"explanation":"得分点：比特、字节\n\n考点原文：计算机内部任何信息都被表示成二进制编码形式。二进制数据的每一位(0或1)是组成二进制信息的最小单位，称为一个【比特】，或称位元，简称位。比特是计算机中处理、存储和传输信息的最小单位。每个西文字符需要用8 位表示，而每个汉字需要用16位才能表示。在计算机内部，二进制信息的计量单位是【字节】，一个字节等于8位。通常用b表示位，用B表示字节。"},
      {"id":"sf41","type":"fill","source":"考点38","text":"平时所说的“某种机器是16位机或是32位机”中的32就指______。","answer":"字长","acceptAnswers":["字长"],"explanation":"得分点：字长\n\n考点原文：平时所说的“某种机器是16位机或是32位机”中的32就指【字长】。"},
      {"id":"se9","type":"essay","source":"考点39","text":"背诵填空：如果以字节为一个排列基本单位，那么______。","refAnswer":"<b>LSB表示最低有效字节，MSB表示最高有效字节</b>\n\n完整考点：\n如果以字节为一个排列基本单位，那么【LSB表示最低有效字节，MSB表示最高有效字节】。"},
      {"id":"sf42","type":"fill","source":"考点40 P66","text":"根据数据中各字节在连续存储单元中排列顺序的不同有大端和小端两种方式：\n______将数据的最高有效字节 MSB存放在最小地址单元中，将最低有效字节LSB存放在最大地址单元中，即数据的地址就是MSB所在的地址。______将数据的最高有效字节MSB存放在高地址中，将最低有效字节LSB存放在低地址中，即数据的地址就是LSB所在的地址。","answer":"大端方式、小端方式","acceptAnswers":["大端方式、小端方式","大端方式 小端方式"],"explanation":"得分点：大端方式、小端方式\n\n考点原文：根据数据中各字节在连续存储单元中排列顺序的不同有大端和小端两种方式：\n【大端方式】将数据的最高有效字节 MSB存放在最小地址单元中，将最低有效字节LSB存放在最大地址单元中，即数据的地址就是MSB所在的地址。【小端方式】将数据的最高有效字节MSB存放在高地址中，将最低有效字节LSB存放在低地址中，即数据的地址就是LSB所在的地址。"},
      {"id":"sf43","type":"fill","source":"考点41","text":"______用来完成基本的逻辑运算和定点数加减运算，各类定点乘除运算和浮点数运算可利用加法器、ALU和移位器来实现，因此基本的运算部件是______，ALU的核心部件是______。","answer":"算术逻辑部件(ALU)、加法器、ALU和移位器、加法器","acceptAnswers":["算术逻辑部件(ALU)、加法器、ALU和移位器、加法器","算术逻辑部件(ALU) 加法器、ALU和移位器 加法器"],"explanation":"得分点：算术逻辑部件(ALU)、加法器、ALU和移位器、加法器\n\n考点原文：【算术逻辑部件(ALU)】用来完成基本的逻辑运算和定点数加减运算，各类定点乘除运算和浮点数运算可利用加法器、ALU和移位器来实现，因此基本的运算部件是【加法器、ALU和移位器】，ALU的核心部件是【加法器】。"},
      {"id":"sf44","type":"fill","source":"考点42","text":"同时考虑两个加数和低位进位的一位加法器称为______。加法器实际上是无符号数加法器。n位加法器可由 n个全加器实现。","answer":"全加器(FA)","acceptAnswers":["FA","全加器","全加器(FA)"],"explanation":"得分点：全加器(FA)\n\n考点原文：同时考虑两个加数和低位进位的一位加法器称为【全加器(FA)】。加法器实际上是无符号数加法器。n位加法器可由 n个全加器实现。"},
      {"id":"sf45","type":"fill","source":"考点43","text":"用全加器实现 n位加法器，采用的是______，因而速度很慢。可以采用其他进位方式来实现快速加法器，如采用先行进位方式的各类先行进位加法器等。","answer":"串行进位方式","acceptAnswers":["串行进位方式"],"explanation":"得分点：串行进位方式\n\n考点原文：用全加器实现 n位加法器，采用的是【串行进位方式】，因而速度很慢。可以采用其他进位方式来实现快速加法器，如采用先行进位方式的各类先行进位加法器等。"},
      {"id":"sf46","type":"fill","source":"考点44","text":"n 位无符号数加法器只能用于______，不能进行无符号整数的减运算，也不能进行带符号整数的加/减运算。要能够进行无符号整数的加/减运算和带符号整数的加/减运算，还需要在无符号数加法器的基础上增加相应的______，使得加法器不仅能计算和/差，还要能够生成相应的标志信息。","answer":"两个 n 位二进制数相加、逻辑门电路","acceptAnswers":["两个 n 位二进制数相加、逻辑门电路","两个 n 位二进制数相加 逻辑门电路"],"explanation":"得分点：两个 n 位二进制数相加、逻辑门电路\n\n考点原文：n 位无符号数加法器只能用于【两个 n 位二进制数相加】，不能进行无符号整数的减运算，也不能进行带符号整数的加/减运算。要能够进行无符号整数的加/减运算和带符号整数的加/减运算，还需要在无符号数加法器的基础上增加相应的【逻辑门电路】，使得加法器不仅能计算和/差，还要能够生成相应的标志信息。"},
      {"id":"sf47","type":"fill","source":"考点45","text":"可通过______来区分带符号整数运算结果和无符号整数运算结果。","answer":"标志信息","acceptAnswers":["标志信息"],"explanation":"得分点：标志信息\n\n考点原文：可通过【标志信息】来区分带符号整数运算结果和无符号整数运算结果。"},
      {"id":"se10","type":"essay","source":"考点46","text":"背诵填空：计算机中的乘法器和除法器分______两种不同的运算电路，原码乘/除运算在______基础上实现，而带符号整数乘/除运算则在______中实现。","refAnswer":"<b>无符号整数和用补码表示的带符号整数、无符号整数乘法器/除法器、补码乘法器/除法器</b>\n\n完整考点：\n计算机中的乘法器和除法器分【无符号整数和用补码表示的带符号整数】两种不同的运算电路，原码乘/除运算在【无符号整数乘法器/除法器】基础上实现，而带符号整数乘/除运算则在【补码乘法器/除法器】中实现。"},
      {"id":"se11","type":"essay","source":"考点47","text":"背诵填空：对阶的原则：______。","refAnswer":"<b>小阶向大阶看齐，阶小的那个数的尾数右移，右移的位数等于两个阶的差的绝对值</b>\n\n完整考点：\n对阶的原则：【小阶向大阶看齐，阶小的那个数的尾数右移，右移的位数等于两个阶的差的绝对值】。"},
      {"id":"sf48","type":"fill","source":"考点48","text":"对阶后两个浮点数的阶码相等，此时，可以进行对阶后的尾数相加减。因为IEEE754采用定点原码小数表示尾数，所以，尾数加减实际上是______。","answer":"定点原码小数的加减运算","acceptAnswers":["定点原码小数的加减运算"],"explanation":"得分点：定点原码小数的加减运算\n\n考点原文：对阶后两个浮点数的阶码相等，此时，可以进行对阶后的尾数相加减。因为IEEE754采用定点原码小数表示尾数，所以，尾数加减实际上是【定点原码小数的加减运算】。"},
      {"id":"sf49","type":"fill","source":"考点49 P90-91","text":"机器指令及汇编指令\n用若干个助记符表示的与机器指令一一对应的指令称为______，用汇编语言编写的程序称为______。用来将汇编语言源程序中的汇编指令翻译成机器指令的程序称为______。将机器指令反过来翻译成汇编指令的程序称为______。机器语言和汇编语言统称为______。用机器指令表示的机器语言程序和用汇编指令表示的汇编语言程序统称为______，是对应高级语言程序的机器级表示。","answer":"汇编指令、汇编语言程序、汇编程序、反汇编程序、机器级语言、机器级程序","acceptAnswers":["汇编指令、汇编语言程序、汇编程序、反汇编程序、机器级语言、机器级程序","汇编指令 汇编语言程序 汇编程序 反汇编程序 机器级语言 机器级程序"],"explanation":"得分点：汇编指令、汇编语言程序、汇编程序、反汇编程序、机器级语言、机器级程序\n\n考点原文：机器指令及汇编指令\n用若干个助记符表示的与机器指令一一对应的指令称为【汇编指令】，用汇编语言编写的程序称为【汇编语言程序】。用来将汇编语言源程序中的汇编指令翻译成机器指令的程序称为【汇编程序】。将机器指令反过来翻译成汇编指令的程序称为【反汇编程序】。机器语言和汇编语言统称为【机器级语言】。用机器指令表示的机器语言程序和用汇编指令表示的汇编语言程序统称为【机器级程序】，是对应高级语言程序的机器级表示。"},
      {"id":"sf50","type":"fill","source":"考点50 P92","text":"指令系统设计风格\n早期指令系统规定其中一个操作数隐含在______中，指令执行的结果也总是送到累加器中。现代计算机都采用______，使用通用寄存器而不是累加器来存放运算过程中所用的临时数据，其指令的操作数可以是立即数(I)或来自通用寄存器(R)或来自存储单元(S)。按指令格式的复杂度来分，可分为______。","answer":"累加器、通用寄存器型指令系统、CISC与RISC两种类型指令系统","acceptAnswers":["累加器、通用寄存器型指令系统、CISC与RISC两种类型指令系统","累加器 通用寄存器型指令系统 CISC与RISC两种类型指令系统"],"explanation":"得分点：累加器、通用寄存器型指令系统、CISC与RISC两种类型指令系统\n\n考点原文：指令系统设计风格\n早期指令系统规定其中一个操作数隐含在【累加器】中，指令执行的结果也总是送到累加器中。现代计算机都采用【通用寄存器型指令系统】，使用通用寄存器而不是累加器来存放运算过程中所用的临时数据，其指令的操作数可以是立即数(I)或来自通用寄存器(R)或来自存储单元(S)。按指令格式的复杂度来分，可分为【CISC与RISC两种类型指令系统】。"},
      {"id":"sf51","type":"fill","source":"考点51","text":"生成机器代码的过程：______。","answer":"预处理→编译→汇编→链接","acceptAnswers":["预处理→编译→汇编→链接"],"explanation":"得分点：预处理→编译→汇编→链接\n\n考点原文：生成机器代码的过程：【预处理→编译→汇编→链接】。"},
      {"id":"sf52","type":"fill","source":"考点52","text":"高级语言中的表达式最终通过______来实现，表达式中出现的变量或常数就是指令中指定的操作数，因而高级语言所支持的数据类型与指令中指定的操作数类型之间有密切的关系。","answer":"指令指定的运算","acceptAnswers":["指令指定的运算"],"explanation":"得分点：指令指定的运算\n\n考点原文：高级语言中的表达式最终通过【指令指定的运算】来实现，表达式中出现的变量或常数就是指令中指定的操作数，因而高级语言所支持的数据类型与指令中指定的操作数类型之间有密切的关系。"},
      {"id":"sf53","type":"fill","source":"考点53","text":"不考虑专门用于控制外设进行输入/输出的I/O指令，IA-32指令的操作数有三类：______。","answer":"立即数、寄存器操作数和存储器操作数","acceptAnswers":["立即数、寄存器操作数 存储器操作数","立即数、寄存器操作数和存储器操作数"],"explanation":"得分点：立即数、寄存器操作数和存储器操作数\n\n考点原文：不考虑专门用于控制外设进行输入/输出的I/O指令，IA-32指令的操作数有三类：【立即数、寄存器操作数和存储器操作数】。\n(1)立即数就在指令中，无须指定其存放位置；\n(2)寄存器操作数需要指定操作数所在寄存器的编号；\n(3)当操作数为存储单元内容时，需要指定操作数所在存储单元的地址。IA-32指令中用到的寄存器主要分为【定点寄存器组、浮点寄存器栈和多媒体扩展寄存器组】。"},
      {"id":"se12","type":"essay","source":"考点53","text":"背诵填空：(3)当操作数为存储单元内容时，需要指定操作数所在存储单元的地址。IA-32指令中用到的寄存器主要分为______。","refAnswer":"<b>定点寄存器组、浮点寄存器栈和多媒体扩展寄存器组</b>\n\n完整考点：\n不考虑专门用于控制外设进行输入/输出的I/O指令，IA-32指令的操作数有三类：【立即数、寄存器操作数和存储器操作数】。\n(1)立即数就在指令中，无须指定其存放位置；\n(2)寄存器操作数需要指定操作数所在寄存器的编号；\n(3)当操作数为存储单元内容时，需要指定操作数所在存储单元的地址。IA-32指令中用到的寄存器主要分为【定点寄存器组、浮点寄存器栈和多媒体扩展寄存器组】。"},
      {"id":"se13","type":"essay","source":"考点54 P101","text":"背诵填空：定点寄存器组\n(1)定点寄存器中共有______。","refAnswer":"<b>8个通用寄存器(GPR)、2个专用寄存器和6个段寄存器</b>\n\n完整考点：\n定点寄存器组\n(1)定点寄存器中共有【8个通用寄存器(GPR)、2个专用寄存器和6个段寄存器】。\n(2)EFLAGS寄存器中第 0~11位中的 9 个标志位是从最早的8086 架构延续下来的，按功能分为6个条件标志和3 个控制标志。其中，【条件标志用来存放运行的状态信息，由硬件自动设定，条件标志有时也称为条件码(CC)；控制标志由软件设定，用于中断响应、串操作和单步执行等控制】。常用条件标志：【OF--溢出标志；SF--符号标志；ZF--零标志；CF--进/借位标志】控制标志：【DF--方向标志；IF--中断允许标志；TF--陷阱标志】"},
      {"id":"se14","type":"essay","source":"考点54 P101","text":"背诵填空：定点寄存器组\n(2)EFLAGS寄存器中第 0~11位中的 9 个标志位是从最早的8086 架构延续下来的，按功能分为6个条件标志和3 个控制标志。其中，______。常用条件标志：______控制标志：______","refAnswer":"<b>条件标志用来存放运行的状态信息，由硬件自动设定，条件标志有时也称为条件码(CC)；控制标志由软件设定，用于中断响应、串操作和单步执行等控制、OF--溢出标志；SF--符号标志；ZF--零标志；CF--进/借位标志、DF--方向标志；IF--中断允许标志；TF--陷阱标志</b>\n\n完整考点：\n定点寄存器组\n(1)定点寄存器中共有【8个通用寄存器(GPR)、2个专用寄存器和6个段寄存器】。\n(2)EFLAGS寄存器中第 0~11位中的 9 个标志位是从最早的8086 架构延续下来的，按功能分为6个条件标志和3 个控制标志。其中，【条件标志用来存放运行的状态信息，由硬件自动设定，条件标志有时也称为条件码(CC)；控制标志由软件设定，用于中断响应、串操作和单步执行等控制】。常用条件标志：【OF--溢出标志；SF--符号标志；ZF--零标志；CF--进/借位标志】控制标志：【DF--方向标志；IF--中断允许标志；TF--陷阱标志】"},
      {"id":"sf54","type":"fill","source":"考点55 P102-103","text":"寻址方式：根据指令给定信息得到操作数或操作数地址的方式\n______：指指令中直接给出操作数。______：指指令中给出操作数所存放的寄存器的编号。","answer":"立即寻址、寄存器寻址","acceptAnswers":["立即寻址、寄存器寻址","立即寻址 寄存器寻址"],"explanation":"得分点：立即寻址、寄存器寻址\n\n考点原文：寻址方式：根据指令给定信息得到操作数或操作数地址的方式\n【立即寻址】：指指令中直接给出操作数。【寄存器寻址】：指指令中给出操作数所存放的寄存器的编号。"},
      {"id":"sf55","type":"fill","source":"考点56","text":"______的引入是为了实现在多任务方式下对不同任务使用的虚拟存储空间进行完全的隔离，以保证不同任务之间不会相互破坏各自的代码和数据。保护模式是80286以上高档微处理器最常用的工作模式。在保护模式下，处理器采用______。","answer":"保护模式、虚拟存储器管理方式","acceptAnswers":["保护模式、虚拟存储器管理方式","保护模式 虚拟存储器管理方式"],"explanation":"得分点：保护模式、虚拟存储器管理方式\n\n考点原文：【保护模式】的引入是为了实现在多任务方式下对不同任务使用的虚拟存储空间进行完全的隔离，以保证不同任务之间不会相互破坏各自的代码和数据。保护模式是80286以上高档微处理器最常用的工作模式。在保护模式下，处理器采用【虚拟存储器管理方式】。"},
      {"id":"sf56","type":"fill","source":"考点57","text":"IA-32采用______，CPU首先通过分段方式得到线性地址LA，再通过分页方式实现从线性地址到物理地址的转换。","answer":"段页式虚拟存储管理方式","acceptAnswers":["段页式虚拟存储管理方式"],"explanation":"得分点：段页式虚拟存储管理方式\n\n考点原文：IA-32采用【段页式虚拟存储管理方式】，CPU首先通过分段方式得到线性地址LA，再通过分页方式实现从线性地址到物理地址的转换。"},
      {"id":"se15","type":"essay","source":"考点58 P07-108","text":"背诵填空：传送指令\n通用数据传送指令传送的是寄存器或存储器中的数据，主要有______。地址传送指令传送的是______，指定的目的寄存器不能是段寄存器，且源操作数必须是存储器寻址方式。","refAnswer":"<b>MOV、MOVS、MOVZ、XCHG、PUSH、POP、操作数的存储地址</b>\n\n完整考点：\n传送指令\n通用数据传送指令传送的是寄存器或存储器中的数据，主要有【MOV、MOVS、MOVZ、XCHG、PUSH、POP】。地址传送指令传送的是【操作数的存储地址】，指定的目的寄存器不能是段寄存器，且源操作数必须是存储器寻址方式。"},
      {"id":"sf57","type":"fill","source":"考点59 P110-111","text":"定点算术运算指令：用于二进制数和无符号十进制数的各种算术运算\n(1)______用于对给定长度的两个位串进行相加或相减，两个操作数中最多只能有一个是存储器操作数，不区分是无符号数还是带符号整数，产生的和/差送到目的地，生成的标志信息送标志寄存器FLAGS/EFLAGS。","answer":"加/减类指令(ADD/SUB)","acceptAnswers":["ADD/SUB","加/减类指令","加/减类指令(ADD/SUB)"],"explanation":"得分点：加/减类指令(ADD/SUB)\n\n考点原文：定点算术运算指令：用于二进制数和无符号十进制数的各种算术运算。\n(1)【加/减类指令(ADD/SUB)】用于对给定长度的两个位串进行相加或相减，两个操作数中最多只能有一个是存储器操作数，不区分是无符号数还是带符号整数，产生的和/差送到目的地，生成的标志信息送标志寄存器FLAGS/EFLAGS。\n(2)【增/减类(INC/DEC)指令】对给定长度的一个位串加1或减1，给定操作数既是源操作数也是目的操作数，不区分是无符号数还是带符号整数，生成的标志信息送标志寄存器FLAGS/EFLAGS，注意不生成 CF标志。\n(3)【取负类指令NEG】用于求操作数的负数，也即，将给定长度的一个位串“各位取反、末位加1”，也称之为取补指令。给定操作数既是源操作数也是目的操作数，生成的标志信息送标志寄存器FLAGS/EFLAGS。\n(4)【比较指令CMP】用于两个寄存器操作数的比较，用目的操作数减去源操作数，结果不送回目的操作数，即两个操作数保持原值不变，只是标志位做相应改变，因而功能类似SUB 指令。通常，该指令后面跟条件跳转指令或条件设置指令。\n(5)【乘法指令】分成 MUL(无符号整数乘)和IMUL(带符号整数乘)两类。对于IMUL指令，可以显式地给出一个、两个或三个操作数，但是，对于MUL指令，只须显式给出一个操作数。"},
      {"id":"sf58","type":"fill","source":"考点59 P110-111","text":"定点算术运算指令：用于二进制数和无符号十进制数的各种算术运算\n(2)______对给定长度的一个位串加1或减1，给定操作数既是源操作数也是目的操作数，不区分是无符号数还是带符号整数，生成的标志信息送标志寄存器FLAGS/EFLAGS，注意不生成 CF标志。","answer":"增/减类(INC/DEC)指令","acceptAnswers":["INC/DEC","增/减类(INC/DEC)指令","增/减类指令"],"explanation":"得分点：增/减类(INC/DEC)指令\n\n考点原文：定点算术运算指令：用于二进制数和无符号十进制数的各种算术运算。\n(1)【加/减类指令(ADD/SUB)】用于对给定长度的两个位串进行相加或相减，两个操作数中最多只能有一个是存储器操作数，不区分是无符号数还是带符号整数，产生的和/差送到目的地，生成的标志信息送标志寄存器FLAGS/EFLAGS。\n(2)【增/减类(INC/DEC)指令】对给定长度的一个位串加1或减1，给定操作数既是源操作数也是目的操作数，不区分是无符号数还是带符号整数，生成的标志信息送标志寄存器FLAGS/EFLAGS，注意不生成 CF标志。\n(3)【取负类指令NEG】用于求操作数的负数，也即，将给定长度的一个位串“各位取反、末位加1”，也称之为取补指令。给定操作数既是源操作数也是目的操作数，生成的标志信息送标志寄存器FLAGS/EFLAGS。\n(4)【比较指令CMP】用于两个寄存器操作数的比较，用目的操作数减去源操作数，结果不送回目的操作数，即两个操作数保持原值不变，只是标志位做相应改变，因而功能类似SUB 指令。通常，该指令后面跟条件跳转指令或条件设置指令。\n(5)【乘法指令】分成 MUL(无符号整数乘)和IMUL(带符号整数乘)两类。对于IMUL指令，可以显式地给出一个、两个或三个操作数，但是，对于MUL指令，只须显式给出一个操作数。"},

      {"id":"sf62","type":"fill","source":"考点60","text":"______：用来对不同长度的操作数进行按位操作，主要分为逻辑运算类指令和移位指令。","answer":"按位运算指令","acceptAnswers":["按位运算指令"],"explanation":"得分点：按位运算指令\n\n考点原文：【按位运算指令】：用来对不同长度的操作数进行按位操作，主要分为逻辑运算类指令和移位指令。"},
      {"id":"sf63","type":"fill","source":"考点61 P114-118","text":"程序执行流控制指令\n______指跳转目标地址由出现在指令机器码中的立即数作为偏移量而计算得到；______指跳转目标地址间接存储在某寄存器或存储单元中。","answer":"直接跳转、间接跳转","acceptAnswers":["直接跳转、间接跳转","直接跳转 间接跳转"],"explanation":"得分点：直接跳转、间接跳转\n\n考点原文：程序执行流控制指令\n【直接跳转】指跳转目标地址由出现在指令机器码中的立即数作为偏移量而计算得到；【间接跳转】指跳转目标地址间接存储在某寄存器或存储单元中。\n(1)无条件跳转指令 JMP的执行结果就是【直接跳转到目标地址处执行】。\n(2)条件跳转指令Jcc(其中 cc为条件助记符)以标志位或标志位组合作为跳转依据。\n(3)条件设置指令用来将条件标志组合得到的条件值设置到一个 8 位通用寄存器中，格式为：SETcc DST\n(4)条件传送指令。功能：如果符合条件就进行传送操作，否则什么都不做。\n(5)调用和返回指令。为便于模块化程序设计，往往把程序中某些具有独立功能的部分编写成独立的程序模块、称之为【子程序】。子程序的使用主要是通过过程调用或函数调用实现。\n(6)陷阱指令。【陷阱】也称为自陷或陷入，它是预先安排的一种“异常”事件，就像预先设定的“陷阱”一样。当执行到陷阱指令(也称自陷指令)时，CPU 就调出特定的程序进行相应处理，处理结束后返回到陷阱指令的下一条指令执行。陷阱的重要作用之一是在用户程序和操作系统内核之间提供一个类似过程调用的接口，称为【系统调用】，用户程序通过系统调用可方便地使用操作系统内核提供的服务。为了使用户程序能够向内核提出系统调用请求，指令集架构会定义若干条特殊的系统调用指令。利用陷阱机制还可以实现【程序调试功能】，包括设置断点和单步跟踪。"},
