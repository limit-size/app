      {"id":"sf67","type":"fill","source":"考点62","text":"IA-32使用栈来支持过程的______，过程的入口参数、返回地址、被保存寄存器的值、被调用过程中的非静态局部变量等都会入栈保存。","answer":"嵌套调用","acceptAnswers":["嵌套调用"],"explanation":"得分点：嵌套调用\n\n考点原文：IA-32使用栈来支持过程的【嵌套调用】，过程的入口参数、返回地址、被保存寄存器的值、被调用过程中的非静态局部变量等都会入栈保存。"},
      {"id":"sf68","type":"fill","source":"考点63","text":"C 语言中的数据类型分为______，复杂数据类型中又分为构造类型和指针类型。","answer":"基本数据类型和复杂数据类型","acceptAnswers":["基本数据类型 复杂数据类型","基本数据类型和复杂数据类型"],"explanation":"得分点：基本数据类型和复杂数据类型\n\n考点原文：C 语言中的数据类型分为【基本数据类型和复杂数据类型】，复杂数据类型中又分为构造类型和指针类型。"},
      {"id":"sf69","type":"fill","source":"考点64","text":"C 函数中的形式参数可以是基本类型变量名、构造类型变量名和指针类型变量名。对于不同类型的形式参数，其传递参数的方式不同，总体来说分为两种：______。","answer":"按值传递和按地址传递","acceptAnswers":["按值传递 按地址传递","按值传递和按地址传递"],"explanation":"得分点：按值传递和按地址传递\n\n考点原文：C 函数中的形式参数可以是基本类型变量名、构造类型变量名和指针类型变量名。对于不同类型的形式参数，其传递参数的方式不同，总体来说分为两种：【按值传递和按地址传递】。"},
      {"id":"sf70","type":"fill","source":"考点65","text":"通常用______来实现多分支选择功能，可以直接跳到某个条件处的语句执行。","answer":"switch语句","acceptAnswers":["switch语句"],"explanation":"得分点：switch语句\n\n考点原文：通常用【switch语句】来实现多分支选择功能，可以直接跳到某个条件处的语句执行。"},
      {"id":"se16","type":"essay","source":"考点66","text":"背诵填空：C 语言中循环结构有三种：______。","refAnswer":"<b>for语句、while语句和do～while语句</b>\n\n完整考点：\nC 语言中循环结构有三种：【for语句、while语句和do～while语句】。"},
      {"id":"se17","type":"essay","source":"考点67","text":"背诵填空：数组可以定义为______，只有auto型数组被分配在栈中，其他存储型数组都分配在静态数据区。","refAnswer":"<b>静态存储型(static)、外部存储型(extern)、自动存储型(auto)或者定义为全局静态区数组</b>\n\n完整考点：\n数组可以定义为【静态存储型(static)、外部存储型(extern)、自动存储型(auto)或者定义为全局静态区数组】，只有auto型数组被分配在栈中，其他存储型数组都分配在静态数据区。"},
      {"id":"sf71","type":"fill","source":"考点68","text":"在指针变量的目标数据类型与数组元素的数据类型相同的前提条件下，指针变量可以指向数组或者数组中的______。","answer":"任意元素","acceptAnswers":["任意元素"],"explanation":"得分点：任意元素\n\n考点原文：在指针变量的目标数据类型与数组元素的数据类型相同的前提条件下，指针变量可以指向数组或者数组中的【任意元素】。"},
      {"id":"sf72","type":"fill","source":"考点69","text":"结构体中的数据成员存放在存储器中一段连续的存储区中，指向结构的指针就是其______。","answer":"第一个字节的地址","acceptAnswers":["第一个字节的地址"],"explanation":"得分点：第一个字节的地址\n\n考点原文：结构体中的数据成员存放在存储器中一段连续的存储区中，指向结构的指针就是其【第一个字节的地址】。"},
      {"id":"sf73","type":"fill","source":"考点70","text":"将一个程序的所有关联模块对应的目标代码文件结合在一起，以形成一个可执行文件的过程称为______，由专门的链接程序(链接器)来实现。","answer":"链接","acceptAnswers":["链接"],"explanation":"得分点：链接\n\n考点原文：将一个程序的所有关联模块对应的目标代码文件结合在一起，以形成一个可执行文件的过程称为【链接】，由专门的链接程序(链接器)来实现。"},
      {"id":"sf74","type":"fill","source":"考点71","text":"______是从源程序变成可执行文件的第一步，C预处理程序为 cpp(即CPreprocessor)，主要用于 C语言编译器对各种预处理命令进行处理，包括______等。","answer":"预处理、对头文件的包含、宏定义的扩展、条件编译的选择","acceptAnswers":["预处理、对头文件的包含、宏定义的扩展、条件编译的选择","预处理 对头文件的包含、宏定义的扩展、条件编译的选择"],"explanation":"得分点：预处理、对头文件的包含、宏定义的扩展、条件编译的选择\n\n考点原文：【预处理】是从源程序变成可执行文件的第一步，C预处理程序为 cpp(即CPreprocessor)，主要用于 C语言编译器对各种预处理命令进行处理，包括【对头文件的包含、宏定义的扩展、条件编译的选择】等。"},
      {"id":"sf75","type":"fill","source":"考点72","text":"汇编的功能是______。","answer":"将编译生成的汇编语言代码转换为机器语言代码","acceptAnswers":["将编译生成的汇编语言代码转换为机器语言代码"],"explanation":"得分点：将编译生成的汇编语言代码转换为机器语言代码\n\n考点原文：汇编的功能是【将编译生成的汇编语言代码转换为机器语言代码】。"},
      {"id":"sf76","type":"fill","source":"考点73","text":"______是机器语言目标文件，不同的是前者是单个模块生成的，后者是多个模块组合而成的。因而，对于前者，代码总是从 0开始，而对于后者，代码在ABI规范规定的虚拟地址空间中产生。","answer":"可重定位文件和可执行文件","acceptAnswers":["可重定位文件 可执行文件","可重定位文件和可执行文件"],"explanation":"得分点：可重定位文件和可执行文件\n\n考点原文：【可重定位文件和可执行文件】是机器语言目标文件，不同的是前者是单个模块生成的，后者是多个模块组合而成的。因而，对于前者，代码总是从 0开始，而对于后者，代码在ABI规范规定的虚拟地址空间中产生。"},
      {"id":"sf77","type":"fill","source":"考点74 P162","text":"链接器在将多个可重定位文件组合成一个可执行文件时，主要完成符号解析和重定位两个任务\n(1)符号解析的目的：______。符号包括全局静态变量名和函数名，而非静态局部变量名则不是符号。","answer":"将每个符号的引用与一个确定的符号定义建立关联","acceptAnswers":["将每个符号的引用与一个确定的符号定义建立关联"],"explanation":"得分点：将每个符号的引用与一个确定的符号定义建立关联\n\n考点原文：链接器在将多个可重定位文件组合成一个可执行文件时，主要完成符号解析和重定位两个任务。\n(1)符号解析的目的：【将每个符号的引用与一个确定的符号定义建立关联】。符号包括全局静态变量名和函数名，而非静态局部变量名则不是符号。\n(2)可重定位文件中的代码区和数据区都是从地址0开始的，链接器需要将不同模块中相同的节合并起来生成一个新的单独的节，并将合并后的代码区和数据区按照ABI 规范确定的【虚拟地址空间划分(也称存储器映像)】来重新确定位置。使用链接的第一个好处就是“模块化”，第二个好处是“效率高”。"},
      {"id":"sf78","type":"fill","source":"考点74 P162","text":"链接器在将多个可重定位文件组合成一个可执行文件时，主要完成符号解析和重定位两个任务\n(2)可重定位文件中的代码区和数据区都是从地址0开始的，链接器需要将不同模块中相同的节合并起来生成一个新的单独的节，并将合并后的代码区和数据区按照ABI 规范确定的______来重新确定位置。使用链接的第一个好处就是“模块化”，第二个好处是“效率高”。","answer":"虚拟地址空间划分(也称存储器映像)","acceptAnswers":["也称存储器映像","虚拟地址空间划分","虚拟地址空间划分(也称存储器映像)"],"explanation":"得分点：虚拟地址空间划分(也称存储器映像)\n\n考点原文：链接器在将多个可重定位文件组合成一个可执行文件时，主要完成符号解析和重定位两个任务。\n(1)符号解析的目的：【将每个符号的引用与一个确定的符号定义建立关联】。符号包括全局静态变量名和函数名，而非静态局部变量名则不是符号。\n(2)可重定位文件中的代码区和数据区都是从地址0开始的，链接器需要将不同模块中相同的节合并起来生成一个新的单独的节，并将合并后的代码区和数据区按照ABI 规范确定的【虚拟地址空间划分(也称存储器映像)】来重新确定位置。使用链接的第一个好处就是“模块化”，第二个好处是“效率高”。"},
      {"id":"sf79","type":"fill","source":"考点75","text":"______指存放目标代码的文件。","answer":"目标文件","acceptAnswers":["目标文件"],"explanation":"得分点：目标文件\n\n考点原文：【目标文件】指存放目标代码的文件。"},
      {"id":"sf80","type":"fill","source":"考点76","text":"______用来指示系统如何创建进程的存储器映像，用于创建进程存储映像的可执行文件和共享库文件必须具有程序头表，而可重定位目标文件无需程序头表。","answer":"程序头表","acceptAnswers":["程序头表"],"explanation":"得分点：程序头表\n\n考点原文：【程序头表】用来指示系统如何创建进程的存储器映像，用于创建进程存储映像的可执行文件和共享库文件必须具有程序头表，而可重定位目标文件无需程序头表。"},
      {"id":"sf81","type":"fill","source":"考点77","text":"可重定位文件主要包含______，它可以与其他可重定位文件链接，从而创建可执行文件或共享库文件。","answer":"代码部分和数据部分","acceptAnswers":["代码部分 数据部分","代码部分和数据部分"],"explanation":"得分点：代码部分和数据部分\n\n考点原文：可重定位文件主要包含【代码部分和数据部分】，它可以与其他可重定位文件链接，从而创建可执行文件或共享库文件。"},
      {"id":"sf82","type":"fill","source":"考点78","text":"64 位系统对应的数据结构为 Elf64_Ehdr,占 64B,其中描述的成员与Elf32_Ehdr类似。文件开头几个字节称为______，通常用来确定文件的类型或格式。","answer":"魔数","acceptAnswers":["魔数"],"explanation":"得分点：魔数\n\n考点原文：64 位系统对应的数据结构为 Elf64_Ehdr,占 64B,其中描述的成员与Elf32_Ehdr类似。文件开头几个字节称为【魔数】，通常用来确定文件的类型或格式。"},
      {"id":"sf83","type":"fill","source":"考点79","text":"对于特定系统，可执行文件与虚拟地址空间之间的存储器映像______。","answer":"由ABI规范定义","acceptAnswers":["由ABI规范定义"],"explanation":"得分点：由ABI规范定义\n\n考点原文：对于特定系统，可执行文件与虚拟地址空间之间的存储器映像【由ABI规范定义】。"},
      {"id":"sf84","type":"fill","source":"考点80 P170-171","text":"对于某个 C 程序模块 m 来说，包含在符号表中的符号有三种不同类型：\n(1)在 m中定义并被其他模块引用的______，包括非静态的函数名和全局变量名。","answer":"全局符号","acceptAnswers":["全局符号"],"explanation":"得分点：全局符号\n\n考点原文：对于某个 C 程序模块 m 来说，包含在符号表中的符号有三种不同类型：\n(1)在 m中定义并被其他模块引用的【全局符号】，包括非静态的函数名和全局变量名。\n(2)由其他模块定义并被 m引用的全局符号，称为m的【外部符号】，包括在m中引用的在其他模块定义的外部函数名和外部变量名。\n(3)在 m中定义并在m 中引用的【本地符号】，包括带static属性的函数名和全局变量名。"},
      {"id":"sf85","type":"fill","source":"考点80 P170-171","text":"对于某个 C 程序模块 m 来说，包含在符号表中的符号有三种不同类型：\n(2)由其他模块定义并被 m引用的全局符号，称为m的______，包括在m中引用的在其他模块定义的外部函数名和外部变量名。","answer":"外部符号","acceptAnswers":["外部符号"],"explanation":"得分点：外部符号\n\n考点原文：对于某个 C 程序模块 m 来说，包含在符号表中的符号有三种不同类型：\n(1)在 m中定义并被其他模块引用的【全局符号】，包括非静态的函数名和全局变量名。\n(2)由其他模块定义并被 m引用的全局符号，称为m的【外部符号】，包括在m中引用的在其他模块定义的外部函数名和外部变量名。\n(3)在 m中定义并在m 中引用的【本地符号】，包括带static属性的函数名和全局变量名。"},
      {"id":"sf86","type":"fill","source":"考点80 P170-171","text":"对于某个 C 程序模块 m 来说，包含在符号表中的符号有三种不同类型：\n(3)在 m中定义并在m 中引用的______，包括带static属性的函数名和全局变量名。","answer":"本地符号","acceptAnswers":["本地符号"],"explanation":"得分点：本地符号\n\n考点原文：对于某个 C 程序模块 m 来说，包含在符号表中的符号有三种不同类型：\n(1)在 m中定义并被其他模块引用的【全局符号】，包括非静态的函数名和全局变量名。\n(2)由其他模块定义并被 m引用的全局符号，称为m的【外部符号】，包括在m中引用的在其他模块定义的外部函数名和外部变量名。\n(3)在 m中定义并在m 中引用的【本地符号】，包括带static属性的函数名和全局变量名。"},
      {"id":"sf87","type":"fill","source":"考点81","text":"在类UNIX系统中，静态库文件采用一种称为______的特殊文件格式，使用.a后缀。","answer":"存档档案","acceptAnswers":["存档档案"],"explanation":"得分点：存档档案\n\n考点原文：在类UNIX系统中，静态库文件采用一种称为【存档档案】的特殊文件格式，使用.a后缀。"},
      {"id":"sf88","type":"fill","source":"考点82","text":"重定位的工作：______。","answer":"节和定义符号的重定位；引用处符号的重定位","acceptAnswers":["节和定义符号的重定位；引用处符号的重定位"],"explanation":"得分点：节和定义符号的重定位；引用处符号的重定位\n\n考点原文：重定位的工作：【节和定义符号的重定位；引用处符号的重定位】。"},
      {"id":"sf89","type":"fill","source":"考点83","text":"类 UNIX系统中共享库文件扩展名为______，Windows 系统中为动态链接库(DLLs)，文件扩展名为______。","answer":".so、.dll","acceptAnswers":[".so、.dll",".so .dll"],"explanation":"得分点：.so、.dll\n\n考点原文：类 UNIX系统中共享库文件扩展名为【.so】，Windows 系统中为动态链接库(DLLs)，文件扩展名为【.dll】。"},
      {"id":"sf90","type":"fill","source":"考点84 P180-181","text":"共享库的动态链接有两个方面的特点\n(1)______：指共享库中的代码段在内存只有一个副本，当应用程序在其代码中需要引用共享库中的符号时，在引用处通过某种方式确定指向共享库中对应定义符号的地址即可。","answer":"“共享性”","acceptAnswers":["“共享性”"],"explanation":"得分点：“共享性”\n\n考点原文：共享库的动态链接有两个方面的特点\n(1)【“共享性”】：指共享库中的代码段在内存只有一个副本，当应用程序在其代码中需要引用共享库中的符号时，在引用处通过某种方式确定指向共享库中对应定义符号的地址即可。\n(2)【“动态性”】：指共享库只在使用它的程序被加载或执行时才加载到内存，因而在共享库更新后并不需要重新对程序进行链接，每次加载或执行程序时所链接的共享库总是最新的。可以利用共享库的这个特性来实现软件分发或生成动态Web网页等。"},
      {"id":"sf91","type":"fill","source":"考点84 P180-181","text":"共享库的动态链接有两个方面的特点\n(2)______：指共享库只在使用它的程序被加载或执行时才加载到内存，因而在共享库更新后并不需要重新对程序进行链接，每次加载或执行程序时所链接的共享库总是最新的。可以利用共享库的这个特性来实现软件分发或生成动态Web网页等。","answer":"“动态性”","acceptAnswers":["“动态性”"],"explanation":"得分点：“动态性”\n\n考点原文：共享库的动态链接有两个方面的特点\n(1)【“共享性”】：指共享库中的代码段在内存只有一个副本，当应用程序在其代码中需要引用共享库中的符号时，在引用处通过某种方式确定指向共享库中对应定义符号的地址即可。\n(2)【“动态性”】：指共享库只在使用它的程序被加载或执行时才加载到内存，因而在共享库更新后并不需要重新对程序进行链接，每次加载或执行程序时所链接的共享库总是最新的。可以利用共享库的这个特性来实现软件分发或生成动态Web网页等。"},
      {"id":"se18","type":"essay","source":"考点85","text":"背诵填空：动态链接有两种方式：______。","refAnswer":"<b>一种是在程序加载过程中加载和链接共享库，另一种是在程序执行过程中加载并链接共享库</b>\n\n完整考点：\n动态链接有两种方式：【一种是在程序加载过程中加载和链接共享库，另一种是在程序执行过程中加载并链接共享库】。"},
      {"id":"sf92","type":"fill","source":"考点86","text":"启动一个可执行目标文件执行时，首先会通过某种方式调出常驻内存的一个称为______的操作系统程序来进行处理。","answer":"加载器","acceptAnswers":["加载器"],"explanation":"得分点：加载器\n\n考点原文：启动一个可执行目标文件执行时，首先会通过某种方式调出常驻内存的一个称为【加载器】的操作系统程序来进行处理。"},
      {"id":"sf93","type":"fill","source":"考点87","text":"______的功能是在当前进程的上下文中加载并运行一个新程序。","answer":"execve函数","acceptAnswers":["execve函数"],"explanation":"得分点：execve函数\n\n考点原文：【execve函数】的功能是在当前进程的上下文中加载并运行一个新程序。"},
      {"id":"sf94","type":"fill","source":"考点88","text":"通常用一个唯一的正整数标识一个进程，称为______。","answer":"进程ID，简写为 PID","acceptAnswers":["进程ID，简写为 PID"],"explanation":"得分点：进程ID，简写为 PID\n\n考点原文：通常用一个唯一的正整数标识一个进程，称为【进程ID，简写为 PID】。"},
      {"id":"sf95","type":"fill","source":"考点89","text":"CPU除了能够正常地不断执行指令以外，还必须具有程序正常执行被打断时的处理机制，称为______，CPU中相应的异常和中断处理逻辑称为中断机构。","answer":"异常控制，也称为中断机制","acceptAnswers":["为中断机制","异常控制，也称为中断机制"],"explanation":"得分点：异常控制，也称为中断机制\n\n考点原文：CPU除了能够正常地不断执行指令以外，还必须具有程序正常执行被打断时的处理机制，称为【异常控制，也称为中断机制】，CPU中相应的异常和中断处理逻辑称为中断机构。"},
      {"id":"sf96","type":"fill","source":"考点90","text":"打断程序正常执行的事件被分成两大类：______。","answer":"内部异常、外部中断(I/O中断)","acceptAnswers":["I/O中断","内部异常、外部中断","内部异常、外部中断(I/O中断)"],"explanation":"得分点：内部异常、外部中断(I/O中断)\n\n考点原文：打断程序正常执行的事件被分成两大类：【内部异常、外部中断(I/O中断)】。"},
      {"id":"se19","type":"essay","source":"考点91","text":"背诵填空：CPU从检测到异常或中断事件，到调出相应的异常/中断处理程序准备执行，其过程称为异常和中断的响应。CPU对异常和中断的响应过程步骤：______。","refAnswer":"<b>保护断点和程序状态、关中断、识别异常和中断事件并转相应处理程序</b>\n\n完整考点：\nCPU从检测到异常或中断事件，到调出相应的异常/中断处理程序准备执行，其过程称为异常和中断的响应。CPU对异常和中断的响应过程步骤：【保护断点和程序状态、关中断、识别异常和中断事件并转相应处理程序】。"},
      {"id":"sf97","type":"fill","source":"考点92","text":"通常把数据通路中专门进行数据运算的部件称为______，数据通路由控制元件(也称控制器)进行控制。","answer":"执行元件或功能元件","acceptAnswers":["功能元件","执行元件","执行元件 功能元件","执行元件或功能元件"],"explanation":"得分点：执行元件或功能元件\n\n考点原文：通常把数据通路中专门进行数据运算的部件称为【执行元件或功能元件】，数据通路由控制元件(也称控制器)进行控制。"},
      {"id":"sf98","type":"fill","source":"考点93","text":"目前使用的存储元件主要有______。用半导体器件构成的存储器称为半导体存储器；磁性材料存储器主要是磁表面存储器，如磁盘存储器和磁带存储器；光介质存储器称为光盘存储器。","answer":"半导体器件、磁性材料和光介质","acceptAnswers":["半导体器件、磁性材料 光介质","半导体器件、磁性材料和光介质"],"explanation":"得分点：半导体器件、磁性材料和光介质\n\n考点原文：目前使用的存储元件主要有【半导体器件、磁性材料和光介质】。用半导体器件构成的存储器称为半导体存储器；磁性材料存储器主要是磁表面存储器，如磁盘存储器和磁带存储器；光介质存储器称为光盘存储器。"},
      {"id":"se20","type":"essay","source":"考点94","text":"背诵填空：随机存取存储器(RAM)的特点：______。","refAnswer":"<b>通过对地址译码来访问存储单元，因为每个地址译码时间相同，所以，在不考虑芯片内部缓冲的前提下，每个单元的访问时间是一个常数，与地址无关</b>\n\n完整考点：\n随机存取存储器(RAM)的特点：【通过对地址译码来访问存储单元，因为每个地址译码时间相同，所以，在不考虑芯片内部缓冲的前提下，每个单元的访问时间是一个常数，与地址无关】。"},
      {"id":"sf99","type":"fill","source":"考点95","text":"存储器按信息的可更改性分为______。读/写存储器中的信息可以读出和写入，RAM芯片是一种读/写存储器；ROM芯片中的信息一旦确定，通常情况下只读不写，但在某些情况下也可重新写入。RAM芯片和ROM芯片都采用______进行信息的访问。","answer":"读/写存储器和只读存储器(ROM)、随机存取方式","acceptAnswers":["读/写存储器和只读存储器(ROM)、随机存取方式","读/写存储器和只读存储器(ROM) 随机存取方式"],"explanation":"得分点：读/写存储器和只读存储器(ROM)、随机存取方式\n\n考点原文：存储器按信息的可更改性分为【读/写存储器和只读存储器(ROM)】。读/写存储器中的信息可以读出和写入，RAM芯片是一种读/写存储器；ROM芯片中的信息一旦确定，通常情况下只读不写，但在某些情况下也可重新写入。RAM芯片和ROM芯片都采用【随机存取方式】进行信息的访问。"},
      {"id":"sf100","type":"fill","source":"考点96","text":"指令直接面向的存储器是主存储器，简称______，由DRAM芯片组成。______由静态 RAM(SRAM)芯片组成，位于主存和CPU之间，存取速度接近CPU的工作速度，用来存放当前CPU经常使用到的指令和数据。","answer":"主存、高速缓存(Cache)","acceptAnswers":["主存、高速缓存(Cache)","主存 高速缓存(Cache)"],"explanation":"得分点：主存、高速缓存(Cache)\n\n考点原文：指令直接面向的存储器是主存储器，简称【主存】，由DRAM芯片组成。【高速缓存(Cache)】由静态 RAM(SRAM)芯片组成，位于主存和CPU之间，存取速度接近CPU的工作速度，用来存放当前CPU经常使用到的指令和数据。"},
      {"id":"se21","type":"essay","source":"考点97 P199","text":"背诵填空：存储器按断电后信息的可保存性分成非易失(不挥发)性存储器和易失(挥发)性存储器\n非易失性存储器的信息可一直保留，不需电源维持。______。易失性存储器在电源关闭时信息自动丢失，如主存和高速缓存都属于易失性存储器。","refAnswer":"<b>ROM、磁表面存储器、光存储器等都属于非易失性存储器</b>\n\n完整考点：\n存储器按断电后信息的可保存性分成非易失(不挥发)性存储器和易失(挥发)性存储器。\n非易失性存储器的信息可一直保留，不需电源维持。【ROM、磁表面存储器、光存储器等都属于非易失性存储器】。易失性存储器在电源关闭时信息自动丢失，如主存和高速缓存都属于易失性存储器。"},
      {"id":"sf101","type":"fill","source":"考点98","text":"磁盘存储器相对于磁带和光盘存储器速度快，因此，目前大多用磁盘存储器或固态硬盘作为辅存，辅存的内容需要调入主存后才能被CPU访问。磁带存储器和光盘存储器的容量大、速度慢，主要用于信息的备份和脱机存档，因此被用作______。","answer":"海量后备存储器","acceptAnswers":["海量后备存储器"],"explanation":"得分点：海量后备存储器\n\n考点原文：磁盘存储器相对于磁带和光盘存储器速度快，因此，目前大多用磁盘存储器或固态硬盘作为辅存，辅存的内容需要调入主存后才能被CPU访问。磁带存储器和光盘存储器的容量大、速度慢，主要用于信息的备份和脱机存档，因此被用作【海量后备存储器】。"},
      {"id":"sf102","type":"fill","source":"考点99","text":"由存储0或 1的记忆单元构成的存储阵列是存储器的核心部分。这种记忆单元也称为______，它是具有两种稳态的能表示二进制0 和1的物理器件。______也称为存储体、存储矩阵。为了存取存储体中的信息，必须对存储单元编号，所编号码就是地址。对各存储单元进行编号的方式称为______。","answer":"存储元或位元、存储阵列、编址方式","acceptAnswers":["存储元或位元、存储阵列、编址方式","存储元或位元 存储阵列 编址方式"],"explanation":"得分点：存储元或位元、存储阵列、编址方式\n\n考点原文：由存储0或 1的记忆单元构成的存储阵列是存储器的核心部分。这种记忆单元也称为【存储元或位元】，它是具有两种稳态的能表示二进制0 和1的物理器件。【存储阵列】也称为存储体、存储矩阵。为了存取存储体中的信息，必须对存储单元编号，所编号码就是地址。对各存储单元进行编号的方式称为【编址方式】。"},
      {"id":"sf103","type":"fill","source":"考点100","text":"现代处理器一般采用______作为主存，因此主存控制器也称为 DRAM控制器。","answer":"DRAM","acceptAnswers":["DRAM"],"explanation":"得分点：DRAM\n\n考点原文：现代处理器一般采用【DRAM】作为主存，因此主存控制器也称为 DRAM控制器。"},
      {"id":"sf104","type":"fill","source":"考点101","text":"______指它能存放的二进制位数或字节数。______也称存取时间，指访问一次数据所用的时间。存储器容量和访问时间应能随着处理器速度的提高而同步提高，以保持系统性能的平衡。","answer":"存储器容量、存储器的访问时间","acceptAnswers":["存储器容量、存储器的访问时间","存储器容量 存储器的访问时间"],"explanation":"得分点：存储器容量、存储器的访问时间\n\n考点原文：【存储器容量】指它能存放的二进制位数或字节数。【存储器的访问时间】也称存取时间，指访问一次数据所用的时间。存储器容量和访问时间应能随着处理器速度的提高而同步提高，以保持系统性能的平衡。"},
      {"id":"sf105","type":"fill","source":"考点102","text":"______：对大量典型程序运行情况分析的结果表明，在较短时间间隔内，程序产生的访存地址往往集中一个很小的范围，这种现象称为程序访问的局部性，包括：","answer":"程序访问的局部性","acceptAnswers":["程序访问的局部性"],"explanation":"得分点：程序访问的局部性\n\n考点原文：【程序访问的局部性】：对大量典型程序运行情况分析的结果表明，在较短时间间隔内，程序产生的访存地址往往集中一个很小的范围，这种现象称为程序访问的局部性，包括：\n【时间局部性】：指被访问的存储单元在较短时间内很可能被重复访问。【空间局部性】：指被访问的存储单元的邻近单元在较短时间内很可能被访问。"},
      {"id":"sf106","type":"fill","source":"考点102","text":"______：指被访问的存储单元在较短时间内很可能被重复访问。______：指被访问的存储单元的邻近单元在较短时间内很可能被访问。","answer":"时间局部性、空间局部性","acceptAnswers":["时间局部性、空间局部性","时间局部性 空间局部性"],"explanation":"得分点：时间局部性、空间局部性\n\n考点原文：【程序访问的局部性】：对大量典型程序运行情况分析的结果表明，在较短时间间隔内，程序产生的访存地址往往集中一个很小的范围，这种现象称为程序访问的局部性，包括：\n【时间局部性】：指被访问的存储单元在较短时间内很可能被重复访问。【空间局部性】：指被访问的存储单元的邻近单元在较短时间内很可能被访问。"},
      {"id":"sf107","type":"fill","source":"考点103","text":"传统DRAM与CPU之间采用______交换数据。","answer":"异步方式","acceptAnswers":["异步方式"],"explanation":"得分点：异步方式\n\n考点原文：传统DRAM与CPU之间采用【异步方式】交换数据。"},
      {"id":"sf108","type":"fill","source":"考点104","text":"______就是存储器总线，内存条中的信息通过内存条的引脚以及插槽内的引线连接到主板上，再通过主板上的导线连接到位于北桥芯片内或CPU芯片内的主存控制器。现代计算机支持______，支持两条总线同时传输的内存条插槽为______，还有三通道、四通道内存插槽，其总线传输带宽可以分别提高到单通道的两倍、三倍和四倍。","answer":"内存条插槽、多条存储器总线同时传输数据、双通道内存插槽","acceptAnswers":["内存条插槽、多条存储器总线同时传输数据、双通道内存插槽","内存条插槽 多条存储器总线同时传输数据 双通道内存插槽"],"explanation":"得分点：内存条插槽、多条存储器总线同时传输数据、双通道内存插槽\n\n考点原文：【内存条插槽】就是存储器总线，内存条中的信息通过内存条的引脚以及插槽内的引线连接到主板上，再通过主板上的导线连接到位于北桥芯片内或CPU芯片内的主存控制器。现代计算机支持【多条存储器总线同时传输数据】，支持两条总线同时传输的内存条插槽为【双通道内存插槽】，还有三通道、四通道内存插槽，其总线传输带宽可以分别提高到单通道的两倍、三倍和四倍。"},
      {"id":"sf109","type":"fill","source":"考点105","text":"______是容量的扩充，位数不变。","answer":"字扩展","acceptAnswers":["字扩展"],"explanation":"得分点：字扩展\n\n考点原文：【字扩展】是容量的扩充，位数不变。"},
      {"id":"se22","type":"essay","source":"考点106 P209-210","text":"背诵填空：磁盘存储器的结构\n磁盘存储器主要由______组成。磁盘控制器包括______。磁盘驱动器包括______。______指根据主机访问控制字中的盘地址(柱面号、磁头号、扇区号)读/写目标磁道中的指定扇区。其操作包含______三个步骤。","refAnswer":"<b>磁记录介质、磁盘驱动器、磁盘控制器、控制逻辑、时序电路、“并→串”转换和“串→并”转换电路、读/写电路、读/写转换开关、读/写磁头与磁头定位伺服系统、磁盘读/写、寻道、旋转等待和读/写</b>\n\n完整考点：\n磁盘存储器的结构\n磁盘存储器主要由【磁记录介质、磁盘驱动器、磁盘控制器】组成。磁盘控制器包括【控制逻辑、时序电路、“并→串”转换和“串→并”转换电路】。磁盘驱动器包括【读/写电路、读/写转换开关、读/写磁头与磁头定位伺服系统】。【磁盘读/写】指根据主机访问控制字中的盘地址(柱面号、磁头号、扇区号)读/写目标磁道中的指定扇区。其操作包含【寻道、旋转等待和读/写】三个步骤。"},
      {"id":"sf110","type":"fill","source":"考点107","text":"现代计算机中，通常将复杂的磁盘物理扇区抽象成固定大小的______，物理扇区和逻辑块之间的映射由磁盘控制器来维护。______是主机与磁盘驱动器之间的接口，其中的内置固件能将CPU送来的请求______转换为盘地址，并控制磁盘驱动器工作。","answer":"逻辑块、磁盘控制器、逻辑块号","acceptAnswers":["逻辑块、磁盘控制器、逻辑块号","逻辑块 磁盘控制器 逻辑块号"],"explanation":"得分点：逻辑块、磁盘控制器、逻辑块号\n\n考点原文：现代计算机中，通常将复杂的磁盘物理扇区抽象成固定大小的【逻辑块】，物理扇区和逻辑块之间的映射由磁盘控制器来维护。【磁盘控制器】是主机与磁盘驱动器之间的接口，其中的内置固件能将CPU送来的请求【逻辑块号】转换为盘地址，并控制磁盘驱动器工作。"},
      {"id":"sf111","type":"fill","source":"考点108","text":"磁盘与主机交换数据的最小单位是______，磁盘总是按成批数据交换方式进行读/写，这种高速批数据交换设备通常采用______进行数据的输入/输出。","answer":"一个扇区、直接存储器存取(DMA)方式","acceptAnswers":["一个扇区、直接存储器存取(DMA)方式","一个扇区 直接存储器存取(DMA)方式"],"explanation":"得分点：一个扇区、直接存储器存取(DMA)方式\n\n考点原文：磁盘与主机交换数据的最小单位是【一个扇区】，磁盘总是按成批数据交换方式进行读/写，这种高速批数据交换设备通常采用【直接存储器存取(DMA)方式】进行数据的输入/输出。"},
      {"id":"se23","type":"essay","source":"考点109","text":"背诵填空：______，是一种非易失性读/写存储器，兼有RAM和ROM的优点，且功耗低、集成度高，无需后备电源。闪存的基本操作：______。","refAnswer":"<b>闪速存储器也称闪存或 Flash存储器、编程(充电)、擦除(放电)、读取</b>\n\n完整考点：\n【闪速存储器也称闪存或 Flash存储器】，是一种非易失性读/写存储器，兼有RAM和ROM的优点，且功耗低、集成度高，无需后备电源。闪存的基本操作：【编程(充电)、擦除(放电)、读取】。"},
      {"id":"sf112","type":"fill","source":"考点110","text":"______也称为电子硬盘，并不是一种磁表面存储器，而是使用NAND闪存组成的外存，与U盘没有本质差别，只是容量更大，存取性能更好。","answer":"固态硬盘(SSD)","acceptAnswers":["SSD","固态硬盘","固态硬盘(SSD)"],"explanation":"得分点：固态硬盘(SSD)\n\n考点原文：【固态硬盘(SSD)】也称为电子硬盘，并不是一种磁表面存储器，而是使用NAND闪存组成的外存，与U盘没有本质差别，只是容量更大，存取性能更好。"},
      {"id":"sf113","type":"fill","source":"考点111","text":"为便于cache和主存交换信息，一般将cache和主存空间划分为大小相等的区域。主存中的区域称为______，也称为主存块，它是cache和主存之间的信息交换单位。","answer":"块","acceptAnswers":["块"],"explanation":"得分点：块\n\n考点原文：为便于cache和主存交换信息，一般将cache和主存空间划分为大小相等的区域。主存中的区域称为【块】，也称为主存块，它是cache和主存之间的信息交换单位。"},
      {"id":"sf114","type":"fill","source":"考点112","text":"直接映射的基本思想：将一个主存块映射到固定的 cache行中，也称______。","answer":"模映射","acceptAnswers":["模映射"],"explanation":"得分点：模映射\n\n考点原文：直接映射的基本思想：将一个主存块映射到固定的 cache行中，也称【模映射】。"},
      {"id":"sf115","type":"fill","source":"考点113","text":"全相联的基本思想：______。全相联方式下，只要有空闲cache行，就不会发生冲突，因而块冲突概率低。","answer":"主存块可装入任意 cache行中","acceptAnswers":["主存块可装入任意 cache行中"],"explanation":"得分点：主存块可装入任意 cache行中\n\n考点原文：全相联的基本思想：【主存块可装入任意 cache行中】。全相联方式下，只要有空闲cache行，就不会发生冲突，因而块冲突概率低。"},
      {"id":"se24","type":"essay","source":"考点114","text":"背诵填空：组相联的主要思想：______。","refAnswer":"<b>将cache所有行分成2q个大小相等的组，每组有2S行。每个主存块映射到cache固定组中的任意一行，即采用组间模映射、组内全映射的方式</b>\n\n完整考点：\n组相联的主要思想：【将cache所有行分成2q个大小相等的组，每组有2S行。每个主存块映射到cache固定组中的任意一行，即采用组间模映射、组内全映射的方式】。"},
      {"id":"se25","type":"essay","source":"考点115 P221-222","text":"背诵填空：cache 中主存块的替换算法\n先进先出算法，基本思想：______。最近最少用算法，基本思想：______。最不经常用算法，基本思想：______。随机替换算法：从候选行的主存块中随机选取一个淘汰掉，与使用情况无关。","refAnswer":"<b>总是选择最早装入cache的主存块被替换掉、总是选择近期最少使用的主存块被替换掉、替换掉cache中引用次数最少的块</b>\n\n完整考点：\ncache 中主存块的替换算法\n先进先出算法，基本思想：【总是选择最早装入cache的主存块被替换掉】。最近最少用算法，基本思想：【总是选择近期最少使用的主存块被替换掉】。最不经常用算法，基本思想：【替换掉cache中引用次数最少的块】。随机替换算法：从候选行的主存块中随机选取一个淘汰掉，与使用情况无关。"},
      {"id":"sf116","type":"fill","source":"考点116","text":"目前，在服务器、台式机和笔记本等各类通用计算机系统中都采用______。在采用虚拟存储技术的计算机中执行指令时，CPU通过存储管理部件(MMU)将指令中的______(也称虚拟地址或虚地址，简写为VA)转换为主存的______(也称主存地址或实地址，简写为PA)。","answer":"虚拟存储器技术、逻辑地址、物理地址","acceptAnswers":["虚拟存储器技术、逻辑地址、物理地址","虚拟存储器技术 逻辑地址 物理地址"],"explanation":"得分点：虚拟存储器技术、逻辑地址、物理地址\n\n考点原文：目前，在服务器、台式机和笔记本等各类通用计算机系统中都采用【虚拟存储器技术】。在采用虚拟存储技术的计算机中执行指令时，CPU通过存储管理部件(MMU)将指令中的【逻辑地址】(也称虚拟地址或虚地址，简写为VA)转换为主存的【物理地址】(也称主存地址或实地址，简写为PA)。"},
      {"id":"sf117","type":"fill","source":"考点117","text":"虚拟地址空间分为两大部分：______，分别简称为内核空间和用户空间。","answer":"操作系统内核区和用户虚拟存储空间","acceptAnswers":["操作系统内核区 用户虚拟存储空间","操作系统内核区和用户虚拟存储空间"],"explanation":"得分点：操作系统内核区和用户虚拟存储空间\n\n考点原文：虚拟地址空间分为两大部分：【操作系统内核区和用户虚拟存储空间】，分别简称为内核空间和用户空间。"},
      {"id":"se26","type":"essay","source":"考点118","text":"背诵填空：______映射到用户进程的代码、数据、堆和栈等用户级上下文信息，分为几个区域：______。","refAnswer":"<b>用户空间、用户栈、共享库、堆、可读/写数据区、只读数据和代码区</b>\n\n完整考点：\n【用户空间】映射到用户进程的代码、数据、堆和栈等用户级上下文信息，分为几个区域：【用户栈、共享库、堆、可读/写数据区、只读数据和代码区】。"},
      {"id":"sf118","type":"fill","source":"考点119","text":"虚拟存储器分成三种不同类型：______。","answer":"段式、页式和段页式","acceptAnswers":["段式、页式 段页式","段式、页式和段页式"],"explanation":"得分点：段式、页式和段页式\n\n考点原文：虚拟存储器分成三种不同类型：【段式、页式和段页式】。"},
      {"id":"sf119","type":"fill","source":"考点120","text":"现代操作系统主要采用______","answer":"页式虚拟存储管理方式","acceptAnswers":["页式虚拟存储管理方式"],"explanation":"得分点：页式虚拟存储管理方式\n\n考点原文：现代操作系统主要采用【页式虚拟存储管理方式】\n在页式虚拟存储系统中，虚拟地址空间被划分成大小相等的页，外存和主存之间按页为单位交换信息。虚拟地址空间中的页称为虚拟页、逻辑页或虚页，简称VP；主存空间也被划分成同样大小的页框(页帧)，也称为物理页或实页，简称 PF或PP。"},
      {"id":"sf120","type":"fill","source":"考点121","text":"页式虚拟存储管理采用请求分页思想，仅将当前需要的页从外存调入主存，而其他不活跃的页保留在外存。当访问信息所在页不在主存时，CPU抛出______，此时操作系统从外存将缺失页装入主存。","answer":"缺页异常","acceptAnswers":["缺页异常"],"explanation":"得分点：缺页异常\n\n考点原文：页式虚拟存储管理采用请求分页思想，仅将当前需要的页从外存调入主存，而其他不活跃的页保留在外存。当访问信息所在页不在主存时，CPU抛出【缺页异常】，此时操作系统从外存将缺失页装入主存。"},
      {"id":"se27","type":"essay","source":"考点122","text":"背诵填空：虚拟地址分两个字段：______。主存物理地址也分两个字段：______。","refAnswer":"<b>高位字段为虚拟页号(即虚页号或逻辑页号)，低位字段为页内偏移地址(简称页内地址)、高位字段为物理页号，低位字段为页内偏移地址</b>\n\n完整考点：\n虚拟地址分两个字段：【高位字段为虚拟页号(即虚页号或逻辑页号)，低位字段为页内偏移地址(简称页内地址)】。主存物理地址也分两个字段：【高位字段为物理页号，低位字段为页内偏移地址】。"},
      {"id":"sf121","type":"fill","source":"考点123 P236","text":"存储保护的两种情况\n(1)访问权限保护：检查是否发生了______。","answer":"访问越权","acceptAnswers":["访问越权"],"explanation":"得分点：访问越权\n\n考点原文：存储保护的两种情况\n(1)访问权限保护：检查是否发生了【访问越权】。\n(2)存储区域保护：检查是否发生了【地址越界】，也即是否访问了不该访问的区域。"},
      {"id":"sf122","type":"fill","source":"考点123 P236","text":"存储保护的两种情况\n(2)存储区域保护：检查是否发生了______，也即是否访问了不该访问的区域。","answer":"地址越界","acceptAnswers":["地址越界"],"explanation":"得分点：地址越界\n\n考点原文：存储保护的两种情况\n(1)访问权限保护：检查是否发生了【访问越权】。\n(2)存储区域保护：检查是否发生了【地址越界】，也即是否访问了不该访问的区域。"},
      {"id":"sf123","type":"fill","source":"考点124","text":"I/O子系统主要解决______，即解决如何将所需信息(文字、图表、声音、视频等)通过不同外设输入到计算机中，或者计算机内部处理的结果如何通过相应外设输出给用户。","answer":"信息的输入和输出问题","acceptAnswers":["信息的输入 输出问题","信息的输入和输出问题"],"explanation":"得分点：信息的输入和输出问题\n\n考点原文：I/O子系统主要解决【信息的输入和输出问题】，即解决如何将所需信息(文字、图表、声音、视频等)通过不同外设输入到计算机中，或者计算机内部处理的结果如何通过相应外设输出给用户。"},
      {"id":"se28","type":"essay","source":"考点125","text":"背诵填空：系统I/O软件分三个层次：______。","refAnswer":"<b>与设备无关的 I/O软件层、设备驱动程序层和中断服务程序层</b>\n\n完整考点：\n系统I/O软件分三个层次：【与设备无关的 I/O软件层、设备驱动程序层和中断服务程序层】。"},
      {"id":"sf124","type":"fill","source":"考点126","text":"操作系统在I/O子系统中承担极其重要的作用，这主要是由I/O子系统三个特性决定的：______。","answer":"共享性、复杂性、异步性","acceptAnswers":["共享性、复杂性、异步性"],"explanation":"得分点：共享性、复杂性、异步性\n\n考点原文：操作系统在I/O子系统中承担极其重要的作用，这主要是由I/O子系统三个特性决定的：【共享性、复杂性、异步性】。"},
      {"id":"se29","type":"essay","source":"考点127","text":"背诵填空：I/O软件包括______。","refAnswer":"<b>最上层提出I/O请求的用户空间I/O软件和在底层操作系统中具体进行I/O操作控制的内核空间 I/O软件</b>\n\n完整考点：\nI/O软件包括【最上层提出I/O请求的用户空间I/O软件和在底层操作系统中具体进行I/O操作控制的内核空间 I/O软件】。"},
      {"id":"sf125","type":"fill","source":"考点128","text":"创建一个新文件时，用户应指定其文件名和访问权限，系统将返回一个非负整数，称为______。文件描述符是进程中被打开文件的唯一标识，可用于后续读/写等操作。","answer":"文件描述符","acceptAnswers":["文件描述符"],"explanation":"得分点：文件描述符\n\n考点原文：创建一个新文件时，用户应指定其文件名和访问权限，系统将返回一个非负整数，称为【文件描述符】。文件描述符是进程中被打开文件的唯一标识，可用于后续读/写等操作。"},
      {"id":"se30","type":"essay","source":"考点129","text":"背诵填空：创建每个进程时，都会预先打开三个标准文件：______。","refAnswer":"<b>标准输入(描述符为0)、标准输出(描述符为 1)和标准错误(描述符为2)</b>\n\n完整考点：\n创建每个进程时，都会预先打开三个标准文件：【标准输入(描述符为0)、标准输出(描述符为 1)和标准错误(描述符为2)】。"},
      {"id":"se31","type":"essay","source":"考点130","text":"背诵填空：在UNIX/Linux系统中，常用的系统级I/O函数有______。","refAnswer":"<b>creat、open、read、write、lseek、stat/fstat、close</b>\n\n完整考点：\n在UNIX/Linux系统中，常用的系统级I/O函数有【creat、open、read、write、lseek、stat/fstat、close】。"},
      {"id":"se32","type":"essay","source":"考点131","text":"背诵填空：由open或creat函数指定的文件名______。绝对路径名从根目录开始查找，相对路径名从当前工作目录开始查找。","refAnswer":"<b>可能是以“/”开头的绝对路径名，也可能是不以“/”开头的相对路径名</b>\n\n完整考点：\n由open或creat函数指定的文件名【可能是以“/”开头的绝对路径名，也可能是不以“/”开头的相对路径名】。绝对路径名从根目录开始查找，相对路径名从当前工作目录开始查找。"},
      {"id":"sf126","type":"fill","source":"考点132","text":"作为高速缓存的主存 RAM区可称为______。传统的外部存储器是磁盘，因此上述高速缓存也称为______。","answer":"高速缓存 RAM、磁盘高速缓存","acceptAnswers":["高速缓存 RAM、磁盘高速缓存","高速缓存 RAM 磁盘高速缓存"],"explanation":"得分点：高速缓存 RAM、磁盘高速缓存\n\n考点原文：作为高速缓存的主存 RAM区可称为【高速缓存 RAM】。传统的外部存储器是磁盘，因此上述高速缓存也称为【磁盘高速缓存】。"},
      {"id":"sf127","type":"fill","source":"考点133","text":"I/O控制方式主要有______。","answer":"程序直接控制、中断控制和DMA控制","acceptAnswers":["程序直接控制、中断控制 DMA控制","程序直接控制、中断控制和DMA控制"],"explanation":"得分点：程序直接控制、中断控制和DMA控制\n\n考点原文：I/O控制方式主要有【程序直接控制、中断控制和DMA控制】。"},
      {"id":"sf128","type":"fill","source":"考点134","text":"直接存储器访问(DMA)控制I/O方式使用专门的DMA 接口硬件直接控制在外设和主存之间交换数据，此时数据不经过CPU。通常把该接口硬件称为______。","answer":"DMA控制器","acceptAnswers":["DMA控制器"],"explanation":"得分点：DMA控制器\n\n考点原文：直接存储器访问(DMA)控制I/O方式使用专门的DMA 接口硬件直接控制在外设和主存之间交换数据，此时数据不经过CPU。通常把该接口硬件称为【DMA控制器】。"},
      {"id":"sf129","type":"fill","source":"考点135","text":"中断服务程序包含三个阶段：______。","answer":"准备阶段、处理阶段和恢复阶段","acceptAnswers":["准备阶段、处理阶段 恢复阶段","准备阶段、处理阶段和恢复阶段"],"explanation":"得分点：准备阶段、处理阶段和恢复阶段\n\n考点原文：中断服务程序包含三个阶段：【准备阶段、处理阶段和恢复阶段】。"},
      {"id":"sf130","type":"fill","source":"考点136","text":"在中断处理过程中，若又到来了优先级更高的新中断请求，CPU应立即暂停当前执行的中断服务程序，转去处理新中断，这种情况称为______。","answer":"多重中断或中断嵌套","acceptAnswers":["中断嵌套","多重中断","多重中断 中断嵌套","多重中断或中断嵌套"],"explanation":"得分点：多重中断或中断嵌套\n\n考点原文：在中断处理过程中，若又到来了优先级更高的新中断请求，CPU应立即暂停当前执行的中断服务程序，转去处理新中断，这种情况称为【多重中断或中断嵌套】。"},
      {"id":"sf131","type":"fill","source":"考点137","text":"______：以一个固定大小的数据块为单位与主机交换信息。块设备中的数据块大小通常在512字节以上，通常按照某种组织方式对其进行读/写，每个数据块都有唯一的位置信息，因而是可寻址的。典型的块设备是外部存储器，例如，磁盘驱动器、固态硬盘等。","answer":"块设备","acceptAnswers":["块设备"],"explanation":"得分点：块设备\n\n考点原文：【块设备】：以一个固定大小的数据块为单位与主机交换信息。块设备中的数据块大小通常在512字节以上，通常按照某种组织方式对其进行读/写，每个数据块都有唯一的位置信息，因而是可寻址的。典型的块设备是外部存储器，例如，磁盘驱动器、固态硬盘等。"},
      {"id":"sf132","type":"fill","source":"考点138","text":"早期Intel微处理器的处理器总线称为______，它是主板上最快的总线，主要用于处理器与北桥芯片之间交换信息。FSB的传输速率单位实际上是______，表示每秒钟传输多少兆次。","answer":"前端总线(FSB)、MT/s","acceptAnswers":["前端总线(FSB)、MT/s","前端总线(FSB) MT/s"],"explanation":"得分点：前端总线(FSB)、MT/s\n\n考点原文：早期Intel微处理器的处理器总线称为【前端总线(FSB)】，它是主板上最快的总线，主要用于处理器与北桥芯片之间交换信息。FSB的传输速率单位实际上是【MT/s】，表示每秒钟传输多少兆次。"},
      {"id":"sf133","type":"fill","source":"考点139","text":"______是一种基于包传输的高速点对点连接协议，采用差分信号与专门的时钟信号进行传输。","answer":"QPI总线","acceptAnswers":["QPI总线"],"explanation":"得分点：QPI总线\n\n考点原文：【QPI总线】是一种基于包传输的高速点对点连接协议，采用差分信号与专门的时钟信号进行传输。"},
      {"id":"sf134","type":"fill","source":"考点140","text":"I/O端口的编址方式：______。","answer":"统一编址方式和独立编址方式","acceptAnswers":["统一编址方式 独立编址方式","统一编址方式和独立编址方式"],"explanation":"得分点：统一编址方式和独立编址方式\n\n考点原文：I/O端口的编址方式：【统一编址方式和独立编址方式】。"},
      {"id":"sf135","type":"fill","source":"考点141","text":"统一编址方式下，I/O地址空间与主存地址空间统一编址，主存地址空间分出一部分地址给I/O端口编号。因为这种方式是将 I/O端口映射到主存空间的某段地址，所以也称为______。","answer":"存储器映射方式","acceptAnswers":["存储器映射方式"],"explanation":"得分点：存储器映射方式\n\n考点原文：统一编址方式下，I/O地址空间与主存地址空间统一编址，主存地址空间分出一部分地址给I/O端口编号。因为这种方式是将 I/O端口映射到主存空间的某段地址，所以也称为【存储器映射方式】。"},
      {"id":"se33","type":"essay","source":"名词解释 P35","text":"名词解释：指令集体系结构(ISA)","refAnswer":"简称指令集架构或指令系统，它是软件和硬件之间接口的一个完整定义。ISA 定义了一台计算机可以执行的所有指令的集合，每条指令规定了计算机执行什么操作，以及所处理的操作数存放的地址空间以及操作数类型。"},
      {"id":"se34","type":"essay","source":"名词解释 P40","text":"名词解释：CPU 性能","refAnswer":"指用户CPU时间，它只包含CPU运行用户程序代码的时间。"},
      {"id":"se35","type":"essay","source":"名词解释 P71","text":"名词解释：算术逻辑部件 ALU","refAnswer":"是一种能进行多种算术运算与逻辑运算的组合逻辑电路，其核心部件是带标志加法器，多采用先行进位方式。"},
      {"id":"se36","type":"essay","source":"名词解释 P106","text":"名词解释：机器指令","refAnswer":"是用0和1表示的一串0/1序列，用来指示CPU完成一个特定的原子操作。"},
      {"id":"se37","type":"essay","source":"名词解释 P163","text":"名词解释：目标代码","refAnswer":"指编译器或汇编器处理源代码后所生成的机器语言目标代码。"},
      {"id":"se38","type":"essay","source":"名词解释 P172","text":"名词解释：弱符号","refAnswer":"是通过GCC扩展的属性指示符_attribute_((weak))指定的符号，它与全局符号一样，对于所有被合并目标文件都可见。"},
      {"id":"se39","type":"essay","source":"名词解释 P175","text":"名词解释：静态库","refAnswer":"编译系统通常会提供一种将多个目标模块打包成一个单独的库文件的机制，这个库文件就是静态库。"},
      {"id":"se40","type":"essay","source":"名词解释 P180","text":"名词解释：共享目标文件/共享库文件","refAnswer":"是一种特殊的可重定位目标文件，记录了相应的代码、数据、重定位和符号表信息，能在可执行文件装入或运行时被动态地装入内存并自动被链接，这个过程称为动态链接，由一个称为动态链接器的程序来完成。"},
      {"id":"se41","type":"essay","source":"名词解释 P181","text":"名词解释：程序","refAnswer":"就是代码和数据的集合，程序的代码是一个机器指令序列，因而程序是一种静态的概念，它可以作为文件存放在硬盘中。"},
      {"id":"se42","type":"essay","source":"名词解释 P181","text":"名词解释：进程","refAnswer":"可以看成是程序的一次运行过程，因此进程是一个具有一定独立功能的程序关于某个数据集合的一次运行活动，因而进程具有动态的含义。计算机处理的所有任务实际上是由进程完成的。"},
      {"id":"se43","type":"essay","source":"名词解释 P185","text":"名词解释：指令周期","refAnswer":"CPU取出并执行一条指令的时间。"},
      {"id":"se44","type":"essay","source":"名词解释 P189","text":"名词解释：内部异常","refAnswer":"指由CPU在执行某条指令时引起的与该指令相关的意外事件。如除数为结果溢出、断点、单步跟踪、寻址错、访问超时、非法操作码、栈溢出、缺页、地址越界(段错误)。"},
      {"id":"se45","type":"essay","source":"名词解释 P191","text":"名词解释：数据通路","refAnswer":"机器指令的执行是在 CPU中完成的，通常将指令执行过程中数据所经过的路径，包括路径上的部件称为数据通路。"},
      {"id":"se46","type":"essay","source":"名词解释 P200","text":"名词解释：外部辅助存储器","refAnswer":"系统运行时直接和主存交换信息的存储器称为外部辅助存储器，简称辅存或外存。"},
      {"id":"se47","type":"essay","source":"名词解释 P200","text":"名词解释：编址单位","refAnswer":"指具有相同地址的那些位元构成的一个单位，可以是一个字节(按字节编址)或一个字(按字编址)。现在大多数通用计算机都采用按字节编址方式，即存储体内一个地址中有一个字节。"},
      {"id":"se48","type":"essay","source":"名词解释 P205","text":"名词解释：总线","refAnswer":"是连接其上的各部件共享的传输介质，通常总线由控制线、数据线和地址线构成。"},
      {"id":"se49","type":"essay","source":"名词解释 P206","text":"名词解释：位扩展","refAnswer":"指用若干片位数较少的存储器芯片构成给定字长的存储器。"},
      {"id":"se50","type":"essay","source":"名词解释 P275","text":"名词解释：I/O设备","refAnswer":"又称外围设备、外部设备，简称外设，是计算机系统与人类或其他计算机系统之间交换信息的装置。"},
      {"id":"se51","type":"essay","source":"名词解释 P275","text":"名词解释：字符设备","refAnswer":"是以字符为单位向主机发送或从主机接收字符流的设备。字符设备传送的字符流不能形成数据块，无法定位和寻址。"},
      {"id":"se52","type":"essay","source":"简答题 P30","text":"简答题：高级语言程序与低级语言程序之间的关系","refAnswer":"高级程序设计语言与具体机器结构无关，可读性比机器级语言好，描述能力更强，一条语句可对应几条或几十条指令。不过，因为计算机无法直接理解和执行高级编程语言程序，因而需要将高级语言程序转换成机器语言程序。这个转换过程通常由计算机自动完成，进行这种转换的软件统称为翻译程序。"},
      {"id":"se53","type":"essay","source":"简答题 P30-31","text":"简答题：语言处理程序的功能","refAnswer":"(1)汇编程序用于将汇编语言源程序翻译成机器语言目标程序。\n(2)解释程序用于将源程序中的语句按其执行顺序逐条翻译成机器指令并立即执行。\n(3)编译程序用于将高级语言源程序翻译成汇编语言或机器语言目标程序。"},
      {"id":"se54","type":"essay","source":"简答题 P36-37","text":"简答题：硬件和软件之间的相互关系","refAnswer":"计算机系统由硬件和软件两部分组成，硬件是物理装置的总称，软件包括运行在硬件上的程序和数据以及相关的文档。ISA处于硬件和软件的交界面上，硬件所有的功能都由ISA集中体现，软件通过ISA在计算机上执行。"},
      {"id":"se55","type":"essay","source":"简答题 P54","text":"简答题：反码表示存在的不足","refAnswer":"(1)0的表示不唯一；\n(2)表数范围比补码少一个最小负数；\n(3)运算时必须考虑循环进位。因此，反码在计算机中很少被使用，有时用作数码变换的中间表示形式。"},
      {"id":"se56","type":"essay","source":"简答题 P55","text":"简答题：补码的优点","refAnswer":"(1)与原码和反码相比，数 0的补码表示形式唯一。\n(2)与原码和移码相比，补码运算系统是一种模运算系统，因而可用加法实现减法运算，且符号位可以和数值位一起参加运算。\n(3)与原码和反码相比，它比原码和反码多表示一个最小负数。\n(4)与反码相比，不需要通过循环进位来调整结果。"},
      {"id":"se57","type":"essay","source":"简答题 P57","text":"简答题：C 语言程序数据类型转换的基本规则","refAnswer":"(1)在表达式中，(unsigned)char 和(unsigned)short 类型都自动提升为 int类型。\n(2)在包含两种数据类型的任何运算中，较低级别数据类型应提升为较高级别的数据类型。\n(3)数据类型级别从高到低的顺序是 long double、double、float、unsigned long long、long long、unsigned long、long、unsigned int、int；但是，当long和int具有相同位数时，unsigned int级别高于long。\n(4)赋值语句中，计算结果被转换为要被赋值的那个变量的类型，这个过程可能导致级别提升(被赋值的类型级别高)或者降级(被赋值的类型级别低)，提升是按等值转换到表数范围更大的类型，通常是扩展操作或整数转浮点数类型，一般情况下不会有溢出问题，而降级可能因为表数范围缩小而导致数据溢出问题。\n(5)扩展操作时，若被转换数据是无符号整型，则采用零扩展；若被转换数据是带符号整型，则采用符号扩展。"},
      {"id":"se58","type":"essay","source":"简答题 P59-60","text":"简答题：对 IEEE 754中规定的数进行分类","refAnswer":"(1)全 0阶码全0尾数：+0/-0\n(2)全 1阶码全0尾数：+∞/-∞\n(3)全 1阶码非0尾数：NaN(Not a Number)\n(4)阶码非全 0且非全1：规格化非0数\n(5)全 0阶码非0尾数：非规格化数"},
      {"id":"se59","type":"essay","source":"简答题 P61","text":"简答题：当在 int、float 和 double等类型数据之间进行强制类型转换时，程序将得到以下数值转换结果(假定int 型数为32 位)","refAnswer":"(1)从 int型转换为 float型时，不会发生溢出，但因为 float型有效位数更少，因而可能有有效数字被舍入。\n(2)从 int型或float型转换为double型时，因为double型的有效位数更多，故能保留精确值。\n(3)从 double型转换为 float型时，因为float型表示范围更小，故可能发生溢出，此外，由于有效位数变少，故可能被舍入。\n(4)从 float 型或double型转换为 int型时，因为 int型没有小数部分，所以数据可能会向0方向被截断。此外，因为int型表数范围更小，故可能发生溢出。将大的浮点数转换为整数可能会导致程序错误。"},
      {"id":"se60","type":"essay","source":"简答题 P75","text":"简答题：简述手算除法的基本要点","refAnswer":"(1)被除数与除数相减，若够减，则上商为1；若不够减，则上商为0。\n(2)每次得到的差为中间余数，将除数右移后与上次的中间余数比较。用中间余数减除数，若够减，上商为1；若不够减，上商为 0。\n(3)重复执行第(2)步，直到求得的商的位数足够为止。"},
      {"id":"se61","type":"essay","source":"简答题 P76","text":"简答题：在计算机中两个无符号数除法的运算步骤和算法要点","refAnswer":"(1)操作数预置：在确认被除数和除数都不为 0后，将被除数置于余数寄存器R和余数/商寄存器Q中，除数置于除数寄存器Y中。\n(2)做减法试商：根据R-Y的符号判断是否够减。若结果为正，则上商1，若结果为负，则上商0。上商为0时通过做加法恢复余数。\n(3)中间余数左移后继续试商：手算除法中，每次试商前，除数右移后，与中间余数进行比较。在计算机内部进行除法运算时，除数在除数寄存器中不动，因此，需要将中间余数左移，将左移结果与除数相减以进行比较。左移时中间余数和商一起进行左移，Q的最低位空出，以备上商。"},
      {"id":"se62","type":"essay","source":"简答题 P83-84","text":"简答题：IEEE 754 标准对附加位的舍入模式","refAnswer":"(1)就近舍入。(2)朝+∞方向舍入。(3)朝-∞方向舍入。(4)朝0 方向舍入。"},
      {"id":"se63","type":"essay","source":"简答题 P93","text":"简答题：与CISC相比，RISC指令系统的主要特点","refAnswer":"(1)指令数目少；\n(2)指令格式规整，采用定长指令字方式，操作码和操作数地址等字段的长度固定；\n(3)只有Load/Store指令中的数据需要访存，这种称为Load/Store型指令风格；\n(4)采用大量通用寄存器。"},
      {"id":"se64","type":"essay","source":"简答题 P100","text":"简答题：C语言程序中的基本数据类型","refAnswer":"(1)指针或地址：用来表示字符串或其他数据区域的指针或存储地址，可声明为char*等类型，其宽度为32位，对应IA-32中的双字。\n(2)序数、位串等：用来表示序号、元素个数、元素总长度、位串等的无符号数，可声明为 unsigned char、unsigned short[int]、unsigned[int]、unsigned long[int](括号中的int可省略)类型，分别对应IA-32中的字节、字、双字和双字。\n(3)带符号整数：它是 C 语言中运用最广泛的基本数据类型，可声明为signed char、short[int]、int、long[int]类型，分别对应IA-32中的字节、字、双字和双字，用补码表示。\n(4)浮点数：用来表示实数，可声明为 float、double和longdouble类型，分别采用IEEE 754的单精度、双精度和扩展精度标准表示。"},
      {"id":"se65","type":"essay","source":"简答题 P114","text":"简答题：跳转目标地址的计算方法","refAnswer":"(1)一种是通过将当前EIP的值加偏移量计算得到，因为偏移量是带符号整数，因此跳转目标地址为EIP 内容增加或减少某一个数值得到，也就是采用相对寻址方式得到，可以看成是以当前EIP内容为基准往前或往后跳转，称为相对跳转；\n(2)另一种是直接将指令中设置的目标地址设置到EIP中，称为绝对跳转。"},
      {"id":"se66","type":"essay","source":"简答题 P119","text":"简答题：过程调用的执行步骤","refAnswer":"假定过程P调用过程Q,则P称为调用者,Q称为被调用者：\n(1)P将入口参数(实参)放到Q能访问到的地方。\n(2)P将返回地址存到特定的地方，然后将控制转移到Q。\n(3)Q保存P 的现场，并为自己的非静态局部变量分配空间。\n(4)执行Q的过程体(函数体)。\n(5)Q恢复P 的现场，并释放局部变量所占空间。\n(6)Q取出返回地址，将控制转移到P。"},
      {"id":"se67","type":"essay","source":"简答题 P144","text":"简答题：与IA-32代码相比，x86-64 代码的特点","refAnswer":"(1)比 IA-32具有更多的通用寄存器个数。\n(2)比 IA-32具有更长的通用寄存器位数，从32位扩展到64位。\n(3)字长从 32位变为64位，因而逻辑地址从32位变为64位。\n(4)对于 long double型数据，虽然还是采用与 IA-32相同的80 位扩展精度格式，但是，所分配的存储空间从IA-32的12字节大小扩展为 16字节大小。\n(5)过程调用时，对于整型入口参数只有6个以内的情况，用通用寄存器而不是用栈来传递，因而，很多过程可以不访问栈，使得大多数情况下执行时间比IA-32代码更短。\n(6)128位的XMM 寄存器从原来的 8 个增加到16个，浮点操作采用基于 SSE 的面向XMM寄存器的指令集，浮点数存放在128位的XMM寄存器中。"},
      {"id":"se68","type":"essay","source":"简答题 P162","text":"简答题：使用链接的好处","refAnswer":"(1)模块化：能使一个程序被划分成多个模块，由不同的程序员进行编写，并且可以构建公共的函数库(如数学函数库、标准I/O函数库等)以提供给不同的程序进行重用。\n(2)效率高：每个模块可以分开编译，在程序修改时只须重新编译那些修改过的源程序文件，然后再重新链接，因而从时间上来说，能够提高程序开发的效率；同时，因为源程序文件中无须包含共享库的所有代码，只要直接调用即可，而且在可执行文件运行时的内存中，也只需要包含所调用函数的代码而不需要包含整个共享库，因而链接也有效地提高了空间利用率。"},
      {"id":"se69","type":"essay","source":"简答题 P166","text":"简答题：一个典型的ELF 可重定位目标文件中包含的节","refAnswer":"(1).text\n(2).rodata\n(3)data\n(4).bss\n(5).symtab\n(6).rel.text\n(7).rel.data\n(8).debug\n(9).line\n(10).strtab"},
      {"id":"se70","type":"essay","source":"简答题 P168","text":"简答题：与ELF可重定位文件格式相比，ELF可执行文件的不同点","refAnswer":"(1)ELF头中字段e_entry 给出程序执行入口地址，可重定位文件中此字段为0。\n(2)通常会有.init节和.fini节，其中.init节定义一个_init函数，用于可执行文件开始执行时的初始化工作，当程序开始运行时，系统会在进程进入主函数main之前，先执行这个节中的指令代码。.fini节中包含进程终止时要执行的指令代码，当程序退出时，系统会执行这个节中的指令代码。\n(3)少了.rel.text和.rel.data等重定位信息节。\n(4)多了一个程序头表，也称段头表，它是一个结构数组。"},
      {"id":"se71","type":"essay","source":"简答题 P177","text":"简答题：重定位的目的","refAnswer":"目的是在符号解析的基础上将所有关联的目标模块合并，并确定每个定义符号在ABI规范规定的虚拟地址空间中的地址，在定义符号的引用处重定位引用的地址。"},
      {"id":"se72","type":"essay","source":"简答题 P185","text":"简答题：说明通过shell命令行输入可执行文件名a.out 进行程序加载的过程","refAnswer":"(1)shell 命令行解释器输出一个命令行提示符(如：unix&gt;),并开始接受用户输入的命令行。\n(2)当用户在命令行提示符后输入命令行“./a.out[ enter]”后，shell 命令行程序开始对命令行进行解析，获得各个命令行参数并构造传递给函数execve的参数列表argyv 和参数个数argc。\n(3)调用fork 函数，创建一个子进程。\n(4)以第(2)步命令行解析得到的参数个数argc、参数列表argv 以及全局变量environ 作为参数，调用函数execve,从而实现在当前进程(用 fork新创建的子进程)的上下文中加载并运行a.out程序。在函数 execve中，通过启动加载器执行加载任务并启动程序运行。"},
      {"id":"se73","type":"essay","source":"简答题 P186","text":"简答题：CPU执行一条指令的大致过程步骤-","refAnswer":"(1)指令执行过程：取指令、指令译码、计算源操作数地址并取操作数、执行数据操作、计算目的操作数地址并存结果、计算下条指令地址。\n(2)每条指令的执行可以分解成若干个以下基本操作：读取某存储单元内容(可能指令或操作数或操作数地址)，并将其装入某个寄存器。把某个寄存器中的数据存储到给定的存储单元中。把一个数据从某个寄存器传送到另一个寄存器或者ALU的输入端。在ALU中进行某种算术运算或逻辑运算，并将结果传送到某个寄存器。"},
      {"id":"se74","type":"essay","source":"简答题 P187","text":"简答题：CPU的基本功能","refAnswer":"(1)CPU的基本职能是周而复始地执行指令。\n(2)随着超大规模集成电路技术的发展，更多的功能逻辑被集成到 CPU芯片中，包括cache、MMU、浮点运算逻辑、异常和中断处理逻辑等，CPU的内部组成越来越复杂，甚至可以在一个CPU芯片中集成多个处理器核。但是，不管CPU多复杂，它最基本的部件是数据通路和控制部件。控制部件根据每条指令功能的不同生成对数据通路的控制信号，并正确控制指令的执行流程。"},
      {"id":"se75","type":"essay","source":"简答题 P191","text":"简答题：异常和中断源的识别方式","refAnswer":"(1)软件识别通常是在CPU中设置一个原因寄存器，该寄存器中有一些标识异常原因或中断类型的标志信息。操作系统使用一个统一的异常/中断查询程序，该程序按一定的优先级顺序查询原因寄存器。\n(2)硬件识别称为向量中断方式。这种方式下，通常将不同异常/中断处理程序的首地址称为中断向量，所有中断向量存放在一个表中，称为中断向量表。每种异常和中断类型都被设定一个中断类型号，中断向量存放的位置与对应的中断类型号相关，可以根据中断类型号快速跳转到对应的异常/中断处理程序去执行。"},
      {"id":"se76","type":"essay","source":"简答题 P207","text":"简答题：访存指令的类型","refAnswer":"(1)取数指令：用于将存储单元内容装入 CPU的寄存器中。\n(2)存数指令：用于将CPU寄存器的内容存储到存储单元中。"},
      {"id":"se77","type":"essay","source":"简答题 P211","text":"简答题：磁盘存储器的性能指标","refAnswer":"(1)记录密度：可用道密度和位密度来表示。道密度指在沿磁道分布方向上单位长度内的磁道数。位密度指在沿磁道方向上单位长度内存放的二进制信息量。\n(2)存储容量：指整个存储器存放的二进制信息量，它与磁表面大小和记录密度密切相关。\n(3)数据传输率/数据传输速率：指磁盘存储器完成磁头定位和旋转等待以后，单位时间内读/写存储介质的二进制信息量。\n(4)平均存取时间。磁盘响应读/写请求的过程：首先将读/写请求在队列中排队，出队列后由磁盘控制器解析请求命令，然后进行寻道、旋转等待和读/写数据三个过程。"},
      {"id":"se78","type":"essay","source":"简答题 P216","text":"简答题：根据不同的映射规则，主存块和cache行之间的映射方式","refAnswer":"(1)直接映射：每个主存块映射到 cache的固定行中。\n(2)全相联：每个主存块映射到 cache的任意行中。\n(3)组相联：每个主存块映射到 cache的固定组的任意行中。"},
      {"id":"se79","type":"essay","source":"简答题 P222-223","text":"简答题：cache的写策略","refAnswer":"(1)通写法：也称全写法、直写法或写直达法，其基本做法是，若写命中，则同时写cache和主存，以保持两者一致；若写缺失，则先写主存，并有以下两种处理方式：写分配法、非写分配法。\n(2)回写法：也称一次性写、写回法，其基本做法是，若写命中，则只将内容写入cache而不写入主存；若写缺失，则分配一个cache行并装入主存块，然后更新该行的内容。因此，回写法通常与写分配法组合使用。"},
      {"id":"se80","type":"essay","source":"简答题 P228-229","text":"简答题：虚拟存储机制带来的三大好处","refAnswer":"虚存机制带来了一个假象，使得每个进程好像都独占使用主存，并且主存空间极大：\n(1)每个进程具有一致的虚拟地址空间，从而可以简化存储管理，简化链接器的设计和实现，也简化了程序的加载过程；\n(2)把主存看成是硬盘存储器的一个缓存，在主存中仅保存当前活动的程序段和数据区，并根据需要在硬盘和主存之间进行信息交换，通过这种方式，使有限的主存空间得到了有效利用；\n(3)每个进程的虚拟地址空间是私有的、独立的，因此，可以保护各自进程不被其他进程破坏。"},
      {"id":"se81","type":"essay","source":"简答题 P235","text":"简答题：CPU访存过程中存在的几种缺失情况","refAnswer":"(1)TLB缺失(TLB Miss)：要访问的虚拟页对应的页表项不在TLB中。\n(2)cache 缺失(Cache Miss)：要访问的主存块不在cache中。\n(3)缺页(Page Miss)：要访问的虚拟页不在主存中。"},
      {"id":"se82","type":"essay","source":"简答题 P235-236","text":"简答题：为了支持操作系统实现存储保护，指令集架构和硬件必须具有的基本功能","refAnswer":"(1)使部分 CPU状态只能由操作系统内核程序访问而用户进程只能读不能写，或者根本不能访问。\n(2)支持至少两种特权模式。运行内核程序时处理器所处的模式称为监管模式、内核模式、超级用户模式或管理程序状态，简称管态、管理态、内核态或核心态；执行用户程序时处理器所处的模式称为用户模式、用户状态或目标程序状态，简称为目态或用户态。\n(3)提供在不同特权模式之间相互切换的机制。通常，用户模式下可以通过系统调用(执行陷阱/自陷指令)转入更高特权模式执行。异常/中断处理程序中最后的返回指令可使处理器从更高特权模式转到用户模式。"},
      {"id":"se83","type":"essay","source":"简答题 P250","text":"简答题：I/O子系统工作的大致过程","refAnswer":"(1)首先，CPU在用户态下运行用户进程，当CPU执行到系统调用封装函数对应的指令序列中的陷阱指令时，会从用户态陷入内核态；\n(2)转到内核态执行后，CPU会根据陷阱指令执行时EAX寄存器中的系统调用号，选择执行相应的系统调用服务例程；\n(3)在系统调用服务例程的执行过程中，可能需要调用具体设备的驱动程序；\n(4)在设备驱动程序执行过程中启动外设工作，外设准备好数据或准备好接收数据后，就发出中断请求；\n(5)CPU响应中断后，就调出中断服务程序执行，在中断服务程序中控制主机与设备进行具体的数据交换。"},
      {"id":"se84","type":"essay","source":"简答题 P252","text":"简答题：使用标准I/0 库函数存在的不足","refAnswer":"(1)I/O为同步操作，即程序必须等待I/O操作真正完成后才能继续执行；\n(2)在一些情况下不适合甚至无法使用标准I/O库函数实现I/O功能，如C标准I/O库中不提供读取文件元数据的函数；\n(3)标准I/O库函数还存在一些问题，用它进行网络编程容易造成缓冲区溢出等风险，同时它也不提供对文件进行加锁和解锁等功能。"},
      {"id":"se85","type":"essay","source":"简答题 P268","text":"简答题：程序直接控制I/O方式的特点(优缺点)","refAnswer":"(1)简单、易控制，设备控制器中的控制电路也简单。\n(2)CPU需要从设备控制器中读取状态信息，并在外设未就绪时一直处于忙等待。如果外设的速度比 CPU慢很多，CPU 等待外设完成任务将浪费大量处理器时间。"},
      {"id":"se86","type":"essay","source":"简答题 P269","text":"简答题：中断控制I/O 方式的基本思想","refAnswer":"当需要进行I/O操作时，首先启动外设进行第一个数据的I/O操作，然后阻塞请求I/O的用户进程，并调度其他进程到CPU上执行，期间，外设在设备控制器的控制下工作。外设完成 I/O 操作后，向 CPU 发送一个中断请求信号，CPU检测到该信号后，则进行上下文切换，调出相应的中断服务程序执行。中断服务程序将启动后续数据的I/O操作，然后返回到被打断的进程继续执行。"},
      {"id":"se87","type":"essay","source":"简答题 P279","text":"简答题：I/O接口的主要职能","refAnswer":"(1)数据缓冲。(2)错误和就绪检测。(3)控制和定时。(4)数据格式的转换。"},
      {"id":"se88","type":"essay","source":"简答题 P282-283","text":"简答题：计算机系统的中断系统的基本功能","refAnswer":"(1)及时记录各种中断请求，通常用一个中断请求寄存器来记录。\n(2)自动响应中断请求。\n(3)同时有多个中断请求时，能自动选择并响应优先级最高的中断请求。\n(4)保护被打断程序的断点和现场。\n(5)通过中断屏蔽实现多重中断的嵌套执行。"},
      {"id":"se89","type":"essay","source":"计算题 P17、19","text":"计算题：以IEEE 754 单精度浮点数格式表示十进制数：-1.75,要求结果用十六进制表示","refAnswer":"-1.75=-1.11B=-1.11B×2⁰,因此对应的IEEE754单精度格式数中，符号s=1,阶码e=127+0=0111 1111B,尾数 f=110 0000 0000 0000 0000 0000,即 32位机器数为10111111111000000000000000000000,十六进制表示为BFEO0000H。"},
      {"id":"se90","type":"essay","source":"计算题 P17、19","text":"计算题：假定一个磁盘存储器有 5 个盘片，每片两个面都可存储信息，用于记录信息的磁道数为1000,每个磁道上有2000 个扇区，每个扇区存储4KB 数据，则该磁盘存储器的总容量大约是多少","refAnswer":"磁盘存储器共有5×2=10个盘面，每个盘面的数据容量约为1000×2000×4 KB=10⁶×8 KB≈8GB,因而总容量约为80 GB。"},
      {"id":"se91","type":"essay","source":"分析题","text":"分析题：假设 R[ax]=FFFAH，R[bx]=FFFOH，则执行 Intel 格式指令“add ax，bx”后，AX、BX 中的内容各是什么？标志寄存器 CF、OF、ZF、SF各是多少？要求分别将操作数作为无符号整数和带符号整数来解释并验证指令执行结果。(24年10 月真题)","refAnswer":"根据 Intel 指令格式规定可知，指令“ add ax，bx”的功能是 R[ax]←[ax]+R[bx]。add 指令的执行在补码加减运算器中进行，执行后其结果在AX中，即R[ax]=FFFAH +FFFOH=FFEAH，而 BX 的内容不变，即 R[bx]=FFFOH，标志寄存器 CF=1.SF =1.0F=0.ZF=0。若作为无符号整数来解释，则根据CF=1，可判断其结果溢出；若作为带符号整数来解释，则根据OF=0，可判断其结果不溢出且和为-22。无符号整数加法运算结果验证如下：R[ax]=FFFAH，真值为 65530，R[bx]=FFF0H，真值为 65520，结果为65530+65520 =131050，显然大于 16 位最大可表示的无符号整数 65535，即结果溢出，验证正确。带符号整数加法运算结果验证如下：R[ax]=FFFAH，真值为-110B=-6，R[bx]=FFFOH，真值为-10000B=-16，结果为-6+(-16)=-22，验证正确。"},
      {"id":"se92","type":"essay","source":"分析题","text":"分析题：将以下 Intel格式的汇编指令转换为 GCC 默认的AT&amp;T 格式汇编指令。说明每条指令的含义。(24 年4月真题)","refAnswer":"1 push ebp\n2 mov edx，DWORD PTR [esp + 8]\n3 mov al，255\n4 mov WORD PTR [ebp + 20]，cx\n5 lea eax，[ecx + edx * 2 + 4]\n答案：上述Intel格式汇编指令转换为AT&amp;T格式汇编指令及其指令的含义说明如下(右边#后描述的是相应指令的含义)\n1 pushl %ebp #R[esp]←R[esp]-4，M[R[esp]]←R[ebp]，双字\n2 movl 8(%esp)，%edx #R[edx]←M[R[esp]+8}，双字\n3 movb $255，%al #R[al]←255，字节\n4 movw %cx，20(%ebp) #M[R[ebp]+20]←R[ex]， 字\n5 leal 4(%ecx，%edx，2)，%eax #R[eax]←R[ecx]+R[edx]×2+4，双字"}
    ]
  }
};

// ==================== APP LOGIC ====================
const app = document.getElementById('app');

let state = {
  subject: '13017',
  mode: 'all', // all, choice, fill
  currentQ: 0,
  answers: {},
  showResult: false,
  showExplanation: {},
  fillInputs: {},
  shuffleMode: false,
  questionOrder: [],
  wrongOnly: false,
  showNavigator: false,
};

function getFilteredQuestions() {
  let qs = questionData[state.subject].questions;
  if (state.mode === 'choice') qs = qs.filter(q => q.type === 'choice');
  else if (state.mode === 'fill') qs = qs.filter(q => q.type === 'fill');
  else if (state.mode === 'essay') qs = qs.filter(q => q.type === 'essay');
  if (state.wrongOnly) {
    qs = qs.filter(q => {
      const a = state.answers[q.id];
      return a !== undefined && a !== true;
    });
  }
  return qs;
}

function getQuestions() {
  let qs = getFilteredQuestions();
  if (state.shuffleMode && state.questionOrder.length === qs.length) {
    return state.questionOrder.map(i => qs[i] || qs[0]);
  }
  return qs;
}

function initOrder() {
  let qs = getFilteredQuestions();
  state.questionOrder = qs.map((_, i) => i);
  if (state.shuffleMode) {
    for (let i = state.questionOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.questionOrder[i], state.questionOrder[j]] = [state.questionOrder[j], state.questionOrder[i]];
    }
  }
}

function calcStats() {
  const qs = getFilteredQuestions();
  let total = qs.length, answered = 0, correct = 0, wrong = 0;
  qs.forEach(q => {
    const a = state.answers[q.id];
    if (a !== undefined) {
      answered++;
      if (a === true) correct++;
      else wrong++;
    }
  });
  return { total, answered, correct, wrong };
}

function render() {
  const qs = getQuestions();
  const stats = calcStats();
  const q = qs[state.currentQ];

  if (state.showResult) {
    renderResult(stats);
    return;
  }

  let html = '';

  // Header
  html += `<div class="app-header">
    <h1>自考刷题助手</h1>
    <p>${questionData[state.subject].name}</p>
  </div>`;

  // Subject Tabs
  html += `<div class="subject-tabs">
    <button class="subject-tab ${state.subject === '13017' ? 'active' : ''}" onclick="switchSubject('13017')">计算机网络与信息安全</button>
    <button class="subject-tab ${state.subject === '13015' ? 'active' : ''}" onclick="switchSubject('13015')">计算机系统原理</button>
  </div>`;

  // Mode Tabs
  html += `<div class="mode-tabs">
    <button class="mode-tab ${state.mode === 'all' ? 'active' : ''}" onclick="switchMode('all')">全部题目</button>
    <button class="mode-tab ${state.mode === 'fill' ? 'active' : ''}" onclick="switchMode('fill')">填空题</button>
    <button class="mode-tab ${state.mode === 'essay' ? 'active' : ''}" onclick="switchMode('essay')">简答/背诵</button>
  </div>`;

  // Toggle Row
  html += `<div class="toggle-row">
    <span class="toggle-label">随机顺序</span>
    <div class="toggle-switch ${state.shuffleMode ? 'on' : ''}" onclick="toggleShuffle()"></div>
  </div>
  <div class="toggle-row" style="margin-top:-8px;margin-bottom:16px;">
    <span class="toggle-label">仅显示错题</span>
    <div class="toggle-switch ${state.wrongOnly ? 'on' : ''}" onclick="toggleWrongOnly()"></div>
  </div>`;

  // Stats
  html += `<div class="stats-bar">
    <div class="stat-card"><div class="stat-num">${stats.total}</div><div class="stat-label">总题数</div></div>
    <div class="stat-card"><div class="stat-num">${stats.answered}</div><div class="stat-label">已答</div></div>
    <div class="stat-card correct"><div class="stat-num">${stats.correct}</div><div class="stat-label">正确</div></div>
    <div class="stat-card wrong"><div class="stat-num">${stats.wrong}</div><div class="stat-label">错误</div></div>
  </div>`;

  // Progress
  const pct = stats.total > 0 ? (stats.answered / stats.total * 100) : 0;
  html += `<div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;

  // Navigator toggle
  html += `<div style="text-align:center;margin-bottom:12px;">
    <button onclick="toggleNavigator()" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer;">
      ${state.showNavigator ? '收起' : '展开'}答题卡
    </button>
  </div>`;

  if (state.showNavigator) {
    html += renderNavigator(qs);
  }

  if (!q) {
    html += `<div class="question-card" style="text-align:center;padding:40px;">
      <p style="font-size:18px;color:var(--gray-500);">暂无题目</p>
      <p style="font-size:14px;color:var(--gray-400);margin-top:8px;">尝试切换科目或模式</p>
    </div>`;
    app.innerHTML = html;
    return;
  }

  // Question Card
  html += `<div class="question-card">`;

  // Badge
  const typeLabel = q.type === 'choice' ? '选择题' : q.type === 'fill' ? '填空题' : '简答/背诵题';
  html += `<div class="q-badge">
    <span class="q-type">${typeLabel}</span>
    <span class="q-source">${q.source}</span>
  </div>`;
  html += `<div class="q-number">第 ${state.currentQ + 1} / ${qs.length} 题</div>`;
  html += `<div class="q-text">${q.text}</div>`;

  const answered = state.answers[q.id] !== undefined;

  if (q.type === 'choice') {
    const letters = ['A', 'B', 'C', 'D', 'E'];
    html += `<div class="options-list">`;
    q.options.forEach((opt, i) => {
      let cls = 'option-item';
      if (answered) {
        cls += ' disabled';
        const correctAns = q.correctAnswer !== undefined ? q.correctAnswer : q.answer;
        if (i === correctAns) cls += ' correct';
        else if (state.answers[q.id] === i && i !== correctAns) cls += ' wrong';
      } else if (state.answers[q.id + '_selected'] === i) {
        cls += ' selected';
      }
      html += `<div class="${cls}" onclick="selectOption('${q.id}', ${i})">
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${opt}</div>
      </div>`;
    });
    html += `</div>`;

    if (!answered) {
      html += `<div class="action-row">
        <button class="btn btn-primary" onclick="submitChoice('${q.id}')" ${state.answers[q.id + '_selected'] === undefined ? 'disabled' : ''}>确认答案</button>
      </div>`;
    }
  } else if (q.type === 'fill') {
    const val = state.fillInputs[q.id] || '';
    let inputCls = 'fill-input';
    if (answered) {
      inputCls += state.answers[q.id] === true ? ' correct' : ' wrong';
    }
    html += `<div class="fill-input-wrap">
      <input class="${inputCls}" type="text" placeholder="请输入答案..." value="${escAttr(val)}" 
        ${answered ? 'disabled' : ''} oninput="updateFill('${q.id}', this.value)"
        onkeydown="if(event.key==='Enter')submitFill('${q.id}')">
      ${!answered ? '<div class="fill-hint">按 Enter 或点击确认提交答案</div>' : ''}
    </div>`;

    if (!answered) {
      html += `<div class="action-row">
        <button class="btn btn-primary" onclick="submitFill('${q.id}')">确认答案</button>
      </div>`;
    }
  } else if (q.type === 'essay') {
    // Essay / 简答/综合题 - self-study mode
    html += `<div class="ref-answer" id="ref-${q.id}" style="display:none;">
      <div class="ref-answer-title">参考答案：</div>
      <div>${q.refAnswer}</div>
    </div>`;
    if (!state.answers[q.id + '_shown']) {
      html += `<div class="action-row">
        <button class="btn btn-primary" onclick="showRefAnswer('${q.id}')">显示参考答案</button>
      </div>`;
    } else {
      html += `<div class="action-row">
        <button class="btn btn-outline" onclick="hideRefAnswer('${q.id}')">收起答案</button>
        <button class="btn btn-success" onclick="markEssay('${q.id}', true)" style="flex:1;">掌握了</button>
        <button class="btn" style="flex:1;background:var(--danger-bg);color:#991B1B;border:none;" onclick="markEssay('${q.id}', false)">还需复习</button>
      </div>`;
      // Show the reference answer directly
      html += `<div class="explanation show correct-exp" style="display:block;">
        <div class="exp-title">📖 参考答案</div>
        <div style="white-space:pre-wrap;">${q.refAnswer}</div>
      </div>`;
      if (state.answers[q.id] === true) {
        html += `<div style="text-align:center;margin-top:8px;color:var(--success);font-weight:600;font-size:14px;">✅ 已标记为掌握</div>`;
      } else if (state.answers[q.id] === false) {
        html += `<div style="text-align:center;margin-top:8px;color:var(--danger);font-weight:600;font-size:14px;">📝 已标记为需复习</div>`;
      }
    }
  }

  // Explanation
  if (answered && q.explanation) {
    const isCorrect = state.answers[q.id] === true;
    html += `<div class="explanation show ${isCorrect ? 'correct-exp' : 'wrong-exp'}">
      <div class="exp-title">${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}</div>
      <div style="white-space:pre-wrap;">${q.explanation}</div>
      ${q.type === 'fill' && !isCorrect ? `<div style="margin-top:8px;font-weight:600;">正确答案：${q.answer}</div>` : ''}
    </div>`;
  }

  html += `</div>`;

  // Navigation
  html += `<div class="nav-row">
    <button class="nav-btn" onclick="prevQ()" ${state.currentQ === 0 ? 'disabled' : ''}>← 上一题</button>
    <button class="nav-btn" onclick="nextQ()" ${state.currentQ >= qs.length - 1 ? 'disabled' : ''}>下一题 →</button>
  </div>`;

  // Result button
  if (stats.answered === stats.total && stats.total > 0) {
    html += `<div style="text-align:center;margin-bottom:20px;">
      <button class="btn btn-success" onclick="showResult()" style="max-width:200px;">查看成绩报告</button>
    </div>`;
  }

  // Reset button
  html += `<div style="text-align:center;margin-bottom:20px;">
    <button class="nav-btn" onclick="resetAll()" style="font-size:12px;color:rgba(255,255,255,0.7);">重置本科目答题记录</button>
  </div>`;

  app.innerHTML = html;
}

function renderNavigator(qs) {
  let html = '<div class="q-nav-grid">';
  qs.forEach((q, i) => {
    let cls = 'q-nav-item';
    if (i === state.currentQ) cls += ' current';
    else if (state.answers[q.id] === true) cls += ' correct-nav';
    else if (state.answers[q.id] !== undefined && state.answers[q.id] !== true) cls += ' wrong-nav';
    else if (state.answers[q.id] !== undefined) cls += ' answered';
    html += `<button class="${cls}" onclick="goToQ(${i})">${i + 1}</button>`;
  });
  html += '</div>';
  return html;
}

function renderResult(stats) {
  const pct = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) : 0;
  let icon = '🎉', msg = '太棒了！';
  if (pct < 60) { icon = '💪'; msg = '继续加油！'; }
  else if (pct < 80) { icon = '👍'; msg = '不错，再接再厉！'; }

  let html = `<div class="app-header">
    <h1>自考刷题助手</h1>
    <p>${questionData[state.subject].name} - 成绩报告</p>
  </div>`;

  html += `<div class="subject-tabs">
    <button class="subject-tab ${state.subject === '13017' ? 'active' : ''}" onclick="switchSubject('13017')">计算机网络与信息安全</button>
    <button class="subject-tab ${state.subject === '13015' ? 'active' : ''}" onclick="switchSubject('13015')">计算机系统原理</button>
  </div>`;

  html += `<div class="result-screen">
    <div class="result-icon">${icon}</div>
    <div class="result-score">${pct}分</div>
    <div class="result-label">${msg}</div>
    <div class="result-details">
      <div class="result-detail"><div class="rd-num" style="color:var(--primary)">${stats.total}</div><div class="rd-label">总题数</div></div>
      <div class="result-detail"><div class="rd-num" style="color:var(--success)">${stats.correct}</div><div class="rd-label">正确</div></div>
      <div class="result-detail"><div class="rd-num" style="color:var(--danger)">${stats.wrong}</div><div class="rd-label">错误</div></div>
      <div class="result-detail"><div class="rd-num" style="color:var(--warning)">${stats.total - stats.answered}</div><div class="rd-label">未答</div></div>
    </div>
    <div class="action-row" style="justify-content:center;">
      <button class="btn btn-outline" onclick="backFromResult()">返回继续练习</button>
      <button class="btn btn-primary" onclick="resetAll()">重新开始</button>
    </div>
  </div>`;

  app.innerHTML = html;
}

// ==================== EVENT HANDLERS ====================
window.switchSubject = function(s) {
  state.subject = s;
  state.currentQ = 0;
  state.showResult = false;
  initOrder();
  render();
};

window.switchMode = function(m) {
  state.mode = m;
  state.currentQ = 0;
  state.showResult = false;
  initOrder();
  render();
};

window.toggleShuffle = function() {
  state.shuffleMode = !state.shuffleMode;
  state.currentQ = 0;
  initOrder();
  render();
};

window.toggleWrongOnly = function() {
  state.wrongOnly = !state.wrongOnly;
  state.currentQ = 0;
  render();
};

window.toggleNavigator = function() {
  state.showNavigator = !state.showNavigator;
  render();
};

window.selectOption = function(qid, idx) {
  if (state.answers[qid] !== undefined) return;
  state.answers[qid + '_selected'] = idx;
  render();
};

window.submitChoice = function(qid) {
  const selected = state.answers[qid + '_selected'];
  if (selected === undefined) return;
  const q = getQuestions()[state.currentQ];
  const correctAns = q.correctAnswer !== undefined ? q.correctAnswer : q.answer;
  state.answers[qid] = selected === correctAns;
  render();
};

window.updateFill = function(qid, val) {
  state.fillInputs[qid] = val;
};

function normalizeAnswer(s) {
  return (s || '').toLowerCase().replace(/[\s【】（）()「」《》“”"''‘’·、,，。;；:：!！?？\-—–_/\\]+/g, '');
}

function escAttr(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.submitFill = function(qid) {
  const val = (state.fillInputs[qid] || '').trim();
  if (!val) return;
  const q = getQuestions()[state.currentQ];
  const nv = normalizeAnswer(val);
  if (!nv) return;
  // enumerated 得分点 count only when every listed item is present
  const ok = q.acceptAnswers.some(a => {
    const items = a.split(/[、，,；;。\s]+|和|与/).map(normalizeAnswer).filter(Boolean);
    if (items.length > 1) return items.every(p => nv.includes(p));
    const one = normalizeAnswer(a);
    return !!one && (nv.includes(one) || one.includes(nv));
  });
  state.answers[qid] = ok;
  render();
};

window.prevQ = function() {
  if (state.currentQ > 0) {
    state.currentQ--;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

window.nextQ = function() {
  const qs = getQuestions();
  if (state.currentQ < qs.length - 1) {
    state.currentQ++;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

window.goToQ = function(idx) {
  state.currentQ = idx;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.showResult = function() {
  state.showResult = true;
  render();
};

window.backFromResult = function() {
  state.showResult = false;
  render();
};

window.showRefAnswer = function(qid) {
  state.answers[qid + '_shown'] = true;
  render();
};

window.hideRefAnswer = function(qid) {
  state.answers[qid + '_shown'] = false;
  render();
};

window.markEssay = function(qid, mastered) {
  state.answers[qid] = mastered;
  render();
};

window.resetAll = function() {
  const qs = questionData[state.subject].questions;
  qs.forEach(q => {
    delete state.answers[q.id];
    delete state.answers[q.id + '_selected'];
    delete state.answers[q.id + '_shown'];
    delete state.fillInputs[q.id];
  });
  state.currentQ = 0;
  state.showResult = false;
  state.wrongOnly = false;
  initOrder();
  render();
};

// Init
try {
  initOrder();
  render();
} catch(e) {
  document.getElementById('app').innerHTML = '<div style="color:white;text-align:center;padding:40px;"><h2>加载出错</h2><p>' + e.message + '</p></div>';
  console.error(e);
}
</script>
</body>
</html>
